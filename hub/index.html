<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fxajnoeoclnbggbkkpxn.supabase.co wss://fxajnoeoclnbggbkkpxn.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<title>Rexius Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="../shared/config.js?v=1"></script>
<script src="../retail-yard/vendor/supabase.js"></script>
<script src="../shared/rexius-core.js?v=1"></script>
<style>
/* Same tokens as Retail Yard so the hub and the apps read as one system. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunken:#E3E8E1; --ink:#17201A; --muted:#5A675E; --line:#D0D8CE;
  --accent:#2D6A43; --accent-ink:#FFFFFF; --bad:#B23A30; --bar:#17201A; --bar-ink:#EEF1EC;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111613; --surface:#18201B; --sunken:#212A24; --ink:#E5EBE6; --muted:#98A69D; --line:#2E3832;
  --accent:#6DBB86; --accent-ink:#0D1510; --bad:#EE7B6F; --bar:#0A0E0B; --bar-ink:#E5EBE6; color-scheme:dark; } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

.top{background:var(--bar);color:var(--bar-ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.7rem;letter-spacing:.12em;opacity:.6;margin-left:8px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:color-mix(in srgb,currentColor 35%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main.wrap{padding-block:28px 48px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tiles li{display:flex}
.tile{flex:1;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--ink);border-left-color:var(--accent);transform:translateY(-2px)}
.tile .dept{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile h2{font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.tile p{margin:0;color:var(--muted);font-size:.88rem}
.tile .go{margin-top:auto;font-weight:600;font-size:.82rem;color:var(--accent)}
@media (prefers-reduced-motion: reduce){ .tile{transition:none} .tile:hover{transform:none} }

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.signin{max-width:400px;margin:8vh auto 0;display:grid;gap:14px}
.signin h1{font-size:2rem;text-transform:uppercase;letter-spacing:.04em}
.field{display:grid;gap:4px;font-size:.82rem;font-weight:600}
.field input{padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-weight:400;font-size:1rem}
.hint{font-size:.85rem;color:var(--bad);min-height:1.2em}
.notice{max-width:620px;margin:6vh auto 0;display:grid;gap:10px}
.notice h2{font-size:1.4rem;text-transform:uppercase;letter-spacing:.05em}
.notice ol{margin:0;padding-left:20px;display:grid;gap:6px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunken);padding:1px 5px;border-radius:4px}

.admin{margin-top:36px}
.admin-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.admin-head h2{font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--sunken)}
tbody tr:last-child td{border-bottom:0}
tr.all-row td{background:color-mix(in srgb,var(--accent) 7%,transparent);font-weight:600}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:.45}
.tag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:6px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Rexius<small>APPS</small></div>
  <div class="who" id="who" hidden></div>
</div></header>
<main class="wrap" id="app" aria-live="polite"><p class="muted">Loading…</p></main>
<noscript><p style="padding:16px">This page needs JavaScript turned on.</p></noscript>
<script src="hub.js?v=2"></script>
</body>
</html>
