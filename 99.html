<title>Retail Yard Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: sticky yard header + tab rail; each view is a working surface — bins as walled bays, queues as dense rows. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunken:#E3E8E1; --ink:#17201A; --muted:#5A675E; --line:#D0D8CE;
  --accent:#2D6A43; --accent-ink:#FFFFFF; --pile:#8B6A4A; --wall:#A9B3AA;
  --ok:#2E7D4F; --warn:#B7741A; --bad:#B23A30; --info:#2C5E8C;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px; --bar:#17201A; --bar-ink:#EEF1EC;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201B; --sunken:#212A24; --ink:#E5EBE6; --muted:#98A69D; --line:#2E3832;
  --accent:#6DBB86; --accent-ink:#0D1510; --pile:#B48E68; --wall:#55615A;
  --ok:#6CC08E; --warn:#E3A94B; --bad:#EE7B6F; --info:#7EAEDB; --bar:#0A0E0B; --bar-ink:#E5EBE6; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201B; --sunken:#212A24; --ink:#E5EBE6; --muted:#98A69D; --line:#2E3832;
  --accent:#6DBB86; --accent-ink:#0D1510; --pile:#B48E68; --wall:#55615A;
  --ok:#6CC08E; --warn:#E3A94B; --bad:#EE7B6F; --info:#7EAEDB; --bar:#0A0E0B; --bar-ink:#E5EBE6; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.25rem;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em}
.brand span{font:500 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;opacity:.7}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.who select{background:transparent;color:inherit;border:1px solid color-mix(in srgb,var(--bar-ink) 35%,transparent);border-radius:var(--r);padding:4px 8px}
.who select option{color:var(--ink);background:var(--surface)}
.mode{font:500 .7rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;padding:5px 8px;border-radius:99px;border:1px solid currentColor;opacity:.85}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:inherit;opacity:.7;padding:10px 14px 9px;font:600 .95rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent)}
.tabs .badge{display:inline-block;min-width:18px;padding:2px 5px;margin-left:6px;border-radius:99px;background:var(--warn);color:#fff;font:600 .7rem/1.1 var(--f-mono)}

.demo-note{background:color-mix(in srgb,var(--warn) 14%,var(--bg));border-bottom:1px solid var(--line);font-size:.85rem}
.demo-note .wrap{padding-block:8px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}

main{padding-block:20px 60px}
.view{display:grid;gap:24px}
.sec{display:grid;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.sec-head h2{margin-right:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.summary>div{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.summary .k{font:500 .7rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.summary .v{font:700 2rem/1.05 var(--f-display)}
.summary .v small{font:500 .8rem var(--f-mono);color:var(--muted);margin-left:4px}
.summary .s{font-size:.8rem;color:var(--muted)}
@media (max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Bins */
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;border-top:4px solid var(--ok)}
.bin.st-low,.bin.st-watch{border-top-color:var(--warn)}
.bin.st-out{border-top-color:var(--bad)}
.bin.st-over{border-top-color:var(--info)}
.bin.st-empty{border-top-color:var(--wall)}
.bin-h{display:flex;align-items:center;gap:8px}
.bin-h{align-items:flex-start}
.bin .prod{font:700 1.15rem/1.15 var(--f-body);min-width:0;overflow-wrap:anywhere}
.bin-h .chip{margin-left:auto;flex:0 0 auto}
.bin .code{font:500 .7rem/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gauge{width:100%;height:auto;display:block}
.g-wall{fill:var(--wall)}
.g-empty{fill:var(--sunken)}
.g-fill{fill:var(--pile)}
.st-low .g-fill,.st-watch .g-fill{fill:var(--warn)}
.st-out .g-fill{fill:var(--bad)}
.g-re{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.55}
.g-ground{stroke:var(--ink);stroke-width:1.5}
.level{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.level b{font:700 1.7rem/1 var(--f-display)}
.level .of{color:var(--muted);font-size:.85rem}
.level .u{margin-left:auto;font:.78rem var(--f-mono);color:var(--muted)}
.flows{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0;padding-top:6px;border-top:1px solid var(--line)}
.flows div{display:grid}
.flows dt{font:500 .66rem/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.flows dd{margin:0;font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums}
.flows .neg{color:var(--bad)} .flows .pos{color:var(--ok)}
.bin .btn{justify-self:start}


/* Yard map — positions mirror the HWY 99 bin sheet */
:root{--rowh:24px}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg-ok{background:var(--ok)} .lg-warn{background:var(--warn)} .lg-bad{background:var(--bad)}
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.map{display:grid;gap:3px;padding:10px;min-width:820px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left;gap:0;padding:3px 6px;
  background:var(--sunken);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:4px;cursor:pointer;font-size:.72rem;line-height:1.2;min-width:0}
.tile .lvl{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--pile) 38%,transparent);pointer-events:none}
.tile>span{position:relative}
.tile .tt{font-weight:700;font-size:.8rem;line-height:1.15;padding-right:22px;overflow-wrap:anywhere}
.tile .tcode{position:absolute;top:3px;right:5px;font:500 .6rem/1 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.tile .tv{display:flex;align-items:baseline;gap:4px;font-weight:500;white-space:nowrap}
.tile .tv small{color:var(--muted);font-size:.66rem}
.tile .f{font-size:.64rem;font-weight:600}
.tile .f.out{color:var(--bad)} .tile .f.in{color:var(--ok)}
.tile.st-low,.tile.st-watch{border-left-color:var(--warn)}
.tile.st-low .lvl,.tile.st-watch .lvl{background:color-mix(in srgb,var(--warn) 30%,transparent)}
.tile.st-out{border-left-color:var(--bad)}
.tile.st-over{border-left-color:var(--info)}
.tile.st-empty{border-left-color:var(--wall);border-style:dashed}
.tile:hover{border-color:var(--ink)}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.mark{display:flex;align-items:center;justify-content:center;text-align:center;border-radius:4px;font:600 .7rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:4px}
.mk-booth{background:var(--ink);color:var(--bg)}
.mk-bags{background:repeating-linear-gradient(45deg,var(--sunken) 0 6px,transparent 6px 12px);border:1px dashed var(--wall);color:var(--muted)}

/* Bin capacity editor */
.cap-form{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.cap-form .field{flex:0 1 180px}
.cap-unit{align-self:center;color:var(--muted);font-family:var(--f-mono)}

/* Phone yard: zones of large tiles; bin detail opens as a bottom sheet */
.zone{display:grid;gap:8px}
.zone h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptile{display:grid;gap:6px;text-align:left;padding:10px 12px;min-height:76px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:var(--r);cursor:pointer;min-width:0}
.ptile.st-low,.ptile.st-watch{border-left-color:var(--warn)} .ptile.st-out{border-left-color:var(--bad)} .ptile.st-over{border-left-color:var(--info)} .ptile.st-empty{border-left-color:var(--wall);border-style:dashed}
.ptile.sel{outline:2px solid var(--accent);outline-offset:1px}
.pt-top{display:flex;align-items:flex-start;gap:6px}
.pt-name{font-weight:700;font-size:.95rem;line-height:1.15;overflow-wrap:anywhere;flex:1 1 auto;min-width:0}
.ptile .tcode{position:static;flex:0 0 auto;font:500 .62rem/1.4 var(--f-mono);color:var(--muted)}
.pt-bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.pt-bar i{display:block;height:100%;background:var(--pile)}
.ptile.st-low .pt-bar i,.ptile.st-watch .pt-bar i{background:var(--warn)} .ptile.st-out .pt-bar i{background:var(--bad)}
.pt-num{font-size:.82rem;color:var(--muted)} .pt-num b{color:var(--ink);font-size:1rem}
.pt-num .f{font-size:.72rem;font-weight:600} .pt-num .f.out{color:var(--bad)} .pt-num .f.in{color:var(--ok)}
.sheet-grip{display:none}
@media (max-width:720px){
  .map-legend{display:none}
  #bin-detail.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:82vh;overflow-y:auto;background:var(--surface);
    border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  #bin-detail.sheet .sheet-grip{display:block;width:40px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 6px}
  #bin-detail.sheet .bin{border:0;padding:0}
  #bin-detail.sheet .gauge{max-height:96px}
  #bin-detail.sheet h2{font-size:.9rem;color:var(--muted)}
  body.sheet-open::after{content:"";position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.35)}
  body.sheet-open{overflow:hidden}
  .top .wrap{padding-block:6px}
  .brand h1{font-size:1.3rem} .brand span{display:none}
  .tabs button{padding:10px 11px 9px;font-size:.88rem}
  .summary .v{font-size:1.6rem}
}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font:600 .7rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent);color:var(--c,var(--muted))}
.c-ok{--c:var(--ok)} .c-warn{--c:var(--warn)} .c-bad{--c:var(--bad)} .c-info{--c:var(--info)} .c-acc{--c:var(--accent)} .c-mute{--c:var(--muted)}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.form .full{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field>span{font:500 .7rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.field textarea{min-height:60px;resize:vertical}
.truck-tbl input{width:64px;padding:5px 6px;background:var(--bg);border:1px solid var(--line);border-radius:4px;text-align:right;font-family:var(--f-mono)}
.truck-tbl th[colspan]{text-align:center}
.tote-calc{font-size:1.05rem;font-weight:600;padding:8px 10px;background:var(--sunken);border-radius:var(--r)}
.qty{display:flex;gap:6px}
.qty input{flex:1 1 110px;min-width:90px;font-size:1rem}
.qty select{flex:0 0 auto;width:auto}
@media (min-width:560px){.form .field.wide{grid-column:span 2}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;cursor:pointer;background:var(--bg);flex:1 1 150px}
.seg label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.hint{font-size:.82rem;color:var(--muted);min-height:1.2em}
.hint.warn{color:var(--warn)}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.adder>summary{list-style:none;cursor:pointer}
details.adder>summary::-webkit-details-marker{display:none}
details.adder[open]>summary{margin-bottom:14px}

/* Filters */
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.8rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1 1 240px;min-width:0;display:grid;gap:2px}
.row .main .t{font-weight:600;overflow-wrap:anywhere}
.row .main .m{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.row .vol{flex:0 0 96px;font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.row .vol small{display:block;font-size:.72rem;color:var(--muted)}
.row .date{flex:0 0 104px;font-size:.85rem}
.row .st{flex:0 0 110px}
.row .act{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.row.dim{opacity:.6}
@media (max-width:640px){.row .vol{text-align:left;flex-basis:auto}.row .date,.row .st{flex-basis:auto}}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.inline-form{flex:1 1 100%;background:var(--bg);border:1px dashed var(--line);border-radius:var(--r);padding:12px}

/* Side lists */
.alerts{display:grid;gap:8px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--muted));border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.alert p{margin:0}
.alert .btns{display:flex;gap:6px;flex-wrap:wrap}
.timeline{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl{display:grid;grid-template-columns:72px 1fr auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:baseline}
.tl:first-child{border-top:0}
.tl .d{font:500 .75rem var(--f-mono);color:var(--muted);text-transform:uppercase}
.tl .q{font:500 .85rem var(--f-mono)}
.tl .q.neg{color:var(--bad)} .tl .q.pos{color:var(--ok)}

/* Backfill cards */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:8px;align-content:start}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 2px 4px;border-bottom:2px solid var(--ink)}
.col-h h3{text-transform:uppercase;letter-spacing:.06em;font-size:.95rem}
.col-h .n{margin-left:auto;font:.75rem var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.card .top-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .big{font:700 1.4rem/1 var(--f-display)}
.card .meta{font-size:.8rem;color:var(--muted)}
.hauls-mini{display:grid;gap:4px;font-size:.8rem}
.hauls-mini div{display:flex;gap:6px;align-items:center;justify-content:space-between}
.progress{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.col .empty{padding:10px;font-size:.85rem;border:1px dashed var(--line);border-radius:var(--r)}

/* Tables (setup) */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunken)}
td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Sign-in */
.signin{max-width:420px;margin:8vh auto;padding:24px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =============================================================
   Retail Yard Tracker
   - Demo mode (no config): sample data in this browser only.
   - Live mode: set SUPABASE_URL + SUPABASE_ANON_KEY below, or in Setup.

function dayDiff(iso){ if(!iso) return null; const [y,m,d]=iso.slice(0,10).split('-').map(Number); const t=new Date(); return Math.round((new Date(y,m-1,d) - new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
function fmtDate(iso){
  if(!iso) return '—'; const diff=dayDiff(iso);
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday';
  const [y,m,d]=iso.slice(0,10).split('-').map(Number);

function DemoAdapter(){
  const KEY='ryt-demo-v14';
  let db=store.get(KEY,null); if(!db||db.v!==14){ db=seedDemo(); }
  const save=()=>store.set(KEY,db);
  const me=()=>DEMO_USERS.find(u=>u.id===db.userId)||DEMO_USERS[0];
  const defaultBin=pid=>db.bins.filter(b=>b.active!==false&&b.product_id===pid).sort((a,b)=>(a.sort-b.sort)||a.code.localeCompare(b.code))[0]?.id||null;
  const move=m=>db.movements.unshift({id:uid(),created_at:nowISO(),occurred_on:isoDay(),created_by_name:me().name,...m});
  function syncReq(rid){
    const r=db.backfill_requests.find(x=>x.id===rid); if(!r||r.status==='cancelled') return;
    const hs=db.hauls.filter(h=>h.request_id===rid);
    const del=hs.filter(h=>h.status==='delivered').reduce((s,h)=>s+Number(h.volume_yd),0);
    r.status = del>=r.qty_yd ? 'delivered' : hs.some(h=>['en_route','delivered'].includes(h.status)) ? 'in_progress' : hs.some(h=>h.status==='scheduled') ? 'scheduled' : 'requested';
  }
  function pullTrigger(t,row,old){
    if(t==='internal_orders'||t==='shopify_order_lines'){
      const isShop=t==='shopify_order_lines';
      const label=isShop?'Shopify '+row.order_name:'Internal order — '+row.customer+(row.reference?' · '+row.reference:'');
      if(row.status==='pulled'&&old.status!=='pulled'){
        if(!row.product_id||row.qty_yd==null) throw new Error('Link this Shopify product before it can draw from inventory');
        row.bin_id=row.bin_id||defaultBin(row.product_id);
        if(!row.bin_id) throw new Error('No bin is set up for this product');
        row.pulled_at=nowISO();
        move({bin_id:row.bin_id,product_id:row.product_id,qty_yd:-row.qty_yd,kind:isShop?'shopify':'internal',note:label,...(isShop&&!old.status?{created_by_name:'Shopify'}:{})});
      } else if(old.status==='pulled'&&row.status!=='pulled'){
        move({bin_id:old.bin_id,product_id:old.product_id,qty_yd:Number(old.qty_yd),kind:'adjustment',note:(row.status==='cancelled'&&isShop?'Order cancelled — ':isShop?'Reversed draw — ':'Order undone — ')+label});
        row.pulled_at=null;
      }
    }
    if(t==='hauls'){
      if(row.status==='delivered'&&old.status!=='delivered'){
        row.delivered_at=nowISO();
        move({bin_id:row.bin_id,product_id:row.product_id,qty_yd:Number(row.volume_yd),kind:'backfill',note:'Truck '+row.truck_no+(row.method==='slinger'?' (slinger)':''),occurred_on:row.haul_on});
      } else if(old.status==='delivered'&&row.status!=='delivered'){
        row.delivered_at=null;
        move({bin_id:old.bin_id,product_id:old.product_id,qty_yd:-Number(old.volume_yd),kind:'adjustment',note:'Reversed delivery — Truck '+old.truck_no});
      }
      if(row.request_id) syncReq(row.request_id);
      if(old.request_id&&old.request_id!==row.request_id) syncReq(old.request_id);
    }
  }
  return {
    mode:'demo',
    async load(){
      const onHand={}; db.movements.forEach(m=>{onHand[m.bin_id]=(onHand[m.bin_id]||0)+Number(m.qty_yd);});
      return {products:db.products,bins:db.bins,onHand,movements:db.movements.slice(0,400),internalOrders:db.internal_orders,
        shopifyLines:db.shopify_order_lines,backfills:db.backfill_requests,hauls:db.hauls,settings:db.settings,me:me()};
    },
    async insert(t,row){
      const tmpl={id:uid(),created_at:nowISO(),created_by_name:me().name};
      const r={...tmpl,...row};
      if(t==='hauls'||t==='shopify_order_lines'||t==='internal_orders'){ pullTrigger(t,r,{status:''}); db[t].unshift(r); }
      else db[t].unshift(r);
      save(); return r;
    },
    async update(t,id,patch){
      const r=db[t].find(x=>x.id===id); if(!r) throw new Error('Record not found');
      const old={...r}; const next={...r,...patch};
      pullTrigger(t,next,old); Object.assign(r,next); save();
    },
    async setSetting(k,v){ db.settings[k]=v; save(); },
    setUser(id){ db.userId=id; save(); },
    reset(){ db=seedDemo(); save(); },
  };
}

function LiveAdapter(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.key);
  const q=p=>p.then(({data,error})=>{ if(error) throw error; return data; });
  return {
    mode:'live', sb,
    async session(){ const {data}=await sb.auth.getSession(); return data.session; },
    async sendCode(email){ const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}); if(error) throw error; },
    async verify(email,token){ const {error}=await sb.auth.verifyOtp({email,token,type:'email'}); if(error) throw error; },
    async signOut(){ await sb.auth.signOut(); },
    async load(){
      const {data:{user}}=await sb.auth.getUser();
      const [products,bins,levels,movements,internalOrders,lines,backfills,hauls,settings,profile]=await Promise.all([
        q(sb.from('products').select('*').order('name')),
        q(sb.from('bins').select('*').order('sort').order('code')),
        q(sb.from('bin_on_hand').select('*')),
        q(sb.from('movements').select('*').order('created_at',{ascending:false}).limit(400)),
        q(sb.from('internal_orders').select('*').order('created_at',{ascending:false}).limit(500)),
        q(sb.from('shopify_order_lines').select('*, shopify_orders(order_name,customer_name,created_at_shopify)').order('created_at',{ascending:false}).limit(500)),
        q(sb.from('backfill_requests').select('*').order('created_at',{ascending:false}).limit(300)),
        q(sb.from('hauls').select('*').order('haul_on',{ascending:false}).limit(500)),
        q(sb.from('settings').select('*')),
        q(sb.from('profiles').select('*').eq('id',user.id).maybeSingle()),
      ]);
      const onHand={}; levels.forEach(l=>onHand[l.bin_id]=Number(l.on_hand_yd));
      const shopifyLines=lines.map(l=>({...l,order_name:l.shopify_orders?.order_name,customer_name:l.shopify_orders?.customer_name,ordered_at:l.shopify_orders?.created_at_shopify||l.created_at}));
      const st={}; settings.forEach(s=>st[s.key]=s.value);
      return {products,bins,onHand,movements,internalOrders,shopifyLines,backfills,hauls,settings:st,
        me:{id:user.id,name:profile?.full_name||user.email,role:profile?.role||'viewer'}};
    },
    async insert(t,row){ const clean={...row}; delete clean.created_by_name; return q(sb.from(t).insert(clean).select().single()); },
    async update(t,id,patch){ return q(sb.from(t).update(patch).eq('id',id)); },
    async setSetting(k,v){ return q(sb.from('settings').upsert({key:k,value:v})); },
    subscribe(cb){ sb.channel('yard').on('postgres_changes',{event:'*',schema:'public'},cb).subscribe(); },
  };
}

  d.lineBin=l=>l.bin_id||d.defaultBin(l.product_id);
  const out={}, inc={};
  // "Out" = drawn today (Shopify + internal, net of same-day reversals)
  const todayMv=S.movements.filter(m=>(m.occurred_on||m.created_at.slice(0,10))===isoDay());
  todayMv.forEach(m=>{ if(['shopify','internal'].includes(m.kind)||(m.kind==='adjustment'&&/^(Order undone|Order cancelled|Reversed draw|Reversed pull)/.test(m.note||''))) out[m.bin_id]=(out[m.bin_id]||0)-Number(m.qty_yd); });
  const openHauls=S.hauls.filter(h=>['scheduled','en_route'].includes(h.status));
  openHauls.forEach(h=>{ inc[h.bin_id]=(inc[h.bin_id]||0)+Number(h.volume_yd); });
  const openReqBins=new Set(S.backfills.filter(r=>!['delivered','cancelled'].includes(r.status)).map(r=>r.bin_id));
  d.stats={};
  activeBins.forEach(b=>{
    const onHand=r1(S.onHand[b.id]||0), o=Math.max(0,r1(out[b.id]||0)), i=r1(inc[b.id]||0), proj=r1(onHand+i);
    const re=Number(b.reorder_yd)||0, cap=Number(b.capacity_yd)||0;
    let st='ok';
    if(!b.product_id) st='empty';
    else if(onHand<=0) st='out';
    else if(onHand<=re) st='low';
    else if(cap&&onHand>cap) st='over';
    d.stats[b.id]={onHand,out:o,inc:i,proj,st,hasReq:openReqBins.has(b.id),avail:onHand};
  });
  d.openHauls=openHauls;
  d.unmapped=S.shopifyLines.filter(l=>l.status==='unmapped');
  d.drawnToday=r1(Object.values(out).reduce((a,v)=>a+Math.max(0,v),0));
  const isRev=m=>m.kind==='adjustment'&&/^(Order undone|Order cancelled|Reversed draw|Reversed pull)/.test(m.note||'');
  d.ordersToday=Math.max(0,todayMv.filter(m=>['shopify','internal'].includes(m.kind)).length-todayMv.filter(isRev).length);
  d.shopToday=r1(S.movements.filter(m=>m.kind==='shopify'&&(m.occurred_on||m.created_at.slice(0,10))===isoDay()).reduce((s,m)=>s-Number(m.qty_yd),0));
  D=d;
}

function gauge(b,s){

    <line class="g-re" x1="12" x2="128" y1="${ry.toFixed(1)}" y2="${ry.toFixed(1)}"/>

}

        <div class="form-actions full"><button class="btn primary">Save and draw from inventory</button><span class="hint" id="io-hint"></span></div>
      </form></div>`:''}
    <div class="sec">
      <div class="sec-head"><h2>Recent orders</h2>
        ${A.mode==='demo'&&can.pull()?'<button class="btn sm" data-act="simShop">Simulate a Shopify order</button>':''}
        <div class="filters" data-dyn="pFilters"></div></div>
      <p class="muted" style="margin:0;font-size:.85rem">Every order comes off the yard the moment it's saved. Shopify orders draw on their own; internal orders draw when Jeff saves them.</p>
      <div class="rows" data-dyn="pQueue"></div>
    </div>
    ${can.pull()?`<div class="sec"><div class="sec-head"><h2>Shopify lines on hold</h2><span class="muted" style="font-size:.82rem">These haven't drawn yet. Link the product once and this order, plus every future one, draws automatically.</span></div><div class="rows" data-dyn="pUnmapped"></div></div>`:''}
  </section>`,
  dyn:{
    pFilters(){ return [['all','All'],['internal','Internal'],['shopify','Shopify']].map(([k,l])=>`<button data-act="pullFilter" data-v="${k}" aria-pressed="${UI.pullFilter===k}">${l}</button>`).join(''); },
    pQueue(){
      const f=UI.pullFilter;
      const io=f==='shopify'?[]:S.internalOrders.filter(o=>['pulled','cancelled'].includes(o.status))
        .map(o=>({src:'internal',id:o.id,date:o.pull_on||o.created_at.slice(0,10),at:o.pulled_at||o.created_at,title:o.customer,meta:[o.reference,o.notes,o.created_by_name&&'Entered by '+o.created_by_name].filter(Boolean).join(' · '),product_id:o.product_id,qty:o.qty_yd,status:o.status}));
      const sl=f==='internal'?[]:S.shopifyLines.filter(l=>['pulled','cancelled'].includes(l.status)||(l.status==='ignored'&&l.product_id))
        .map(l=>({src:'shopify',id:l.id,date:(l.ordered_at||l.created_at).slice(0,10),at:l.ordered_at||l.created_at,title:`${l.order_name||'Shopify order'} · ${l.customer_name||''}`,meta:`${l.title} · ${l.variant_title||''}${l.quantity>1?' × '+l.quantity:''}`,product_id:l.product_id,qty:l.qty_yd,status:l.status==='ignored'?'cancelled':l.status}));
      const rows=[...io,...sl].sort((a,b)=>(b.date.localeCompare(a.date))||String(b.at).localeCompare(String(a.at))).slice(0,200);
      if(!rows.length) return `<div class="empty">No orders yet.</div>`;
      return rows.map(r=>{
        let act='';
        if(can.pull()&&r.status==='pulled'){
          act = r.src==='internal' ? confirmBtn('undoIO','Undo',`data-id="${r.id}"`,'ghost') : confirmBtn('reverseShop','Reverse draw',`data-id="${r.id}"`,'ghost');
        }
        return `<div class="row ${r.status==='cancelled'?'dim':''}">
          <span class="chip ${r.src==='shopify'?'c-info':'c-acc'}">${r.src==='shopify'?'Shopify':'Internal'}</span>
          <div class="main"><span class="t">${esc(prodName(r.product_id))}</span><span class="m">${esc(r.title)}${r.meta?' · '+esc(r.meta):''}</span></div>
          <span class="vol">${fmtN(r.qty)} yd³<small>${fmtUnits(r.qty)}</small></span>
          <span class="date">${esc(fmtDate(r.date))}</span>
          <span class="st">${r.status==='pulled'?'<span class="chip c-ok">Drawn</span>':'<span class="chip c-mute">Reversed</span>'}</span>
          <span class="act">${act}</span></div>`;
      }).join('');
    },
    pUnmapped(){
      if(!D.unmapped.length) return `<div class="empty">Nothing on hold. Every Shopify line drew from inventory.</div>`;
      return D.unmapped.map(l=>{
        const open=UI.mapLine===l.id;
        return `<div class="row">
          <span class="chip c-warn">Shopify</span>
          <div class="main"><span class="t">${esc(l.order_name)} · ${esc(l.title)}</span><span class="m">${esc(l.variant_title||'')}${l.yd_each?' yd':''} × ${l.quantity}${l.qty_yd?' = '+fmtYd(l.qty_yd):''} · ${esc(l.customer_name||'')} · No yard product is linked to this Shopify title</span></div>
          <span class="date">${esc(fmtDate((l.ordered_at||l.created_at).slice(0,10)))}</span>
          <span class="act">${open?'':`<button class="btn sm" data-act="mapOpen" data-id="${l.id}">Link product</button>`}${confirmBtn('ignoreLine','Not yard stock',`data-id="${l.id}"`,'ghost')}</span>
          ${open?`<form class="inline-form form" data-form="mapLine" data-id="${l.id}">
            <label class="field"><span>Yard product</span><select name="product_id" required><option value="">Choose…</option>${S.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
            <label class="field"><span>Yards per item</span><input name="yd_each" type="number" step="0.5" min="0.5" required value="${esc(l.yd_each??'')}"></label>
            <label class="field"><span><input type="checkbox" name="link" checked> Use for all orders of “${esc(l.title)}”</span></label>
            <div class="form-actions"><button class="btn primary sm">Link and draw</button><button type="button" class="btn sm ghost" data-act="mapClose">Close</button></div></form>`:''}
        </div>`;
      }).join('');
    },
  },
};

/* ---------- Backfill ---------- */
VIEWS.backfill={
  shell:()=>`<section class="view">
    ${can.request()?`<details class="panel panel-pad adder" ${UI.prefillBin?'open':''}>
      <summary class="sec-head"><h2>Order product</h2><span class="btn sm primary">New order</span></summary>
      <form class="form" data-form="request" autocomplete="off">
        <label class="field"><span>Product</span><select id="rq-bin" name="product_id" required data-hint="rq-hint" data-hint-product="1">${productOptions(UI.prefillBin&&D.bin[UI.prefillBin]?.product_id)}</select></label>
        ${qtyField('qty','Volume needed', UI.prefillQty||'')}
        <label class="field"><span>Needed by</span><input id="rq-date" name="needed_by" type="date" value="${isoDay(1)}"></label>
        <div class="field full"><span>Haul with</span><div class="seg">
          <label><input type="radio" name="method" value="bulk" checked> Bulk truck <span class="muted">· Kevin Roemer dispatches</span></label>
          <label><input type="radio" name="method" value="slinger"> Slinger <span class="muted">· you dispatch</span></label></div></div>
        <label class="field full"><span>Notes for dispatch</span><input id="rq-notes" name="notes"></label>
        <div class="form-actions full"><button class="btn primary">Send order</button><span class="hint" id="rq-hint"></span></div>
      </form></details>`:''}
    <div class="sec"><div class="sec-head"><h2>Product orders</h2><div class="filters" data-dyn="bFilters"></div></div>
      <div class="cols" data-dyn="bBoard"></div></div>
  </section>`,
  dyn:{
    bFilters(){ return [['all','All'],['bulk','Bulk · Kevin'],['slinger','Slinger · Jeff']].map(([k,l])=>`<button data-act="bfFilter" data-v="${k}" aria-pressed="${UI.bfFilter===k}">${l}</button>`).join(''); },
    bBoard(){
      const f=UI.bfFilter;
      const list=S.backfills.filter(r=>r.status!=='cancelled'&&(f==='all'||r.method===f));
      const cols=[['requested','Requested'],['scheduled','Scheduled'],['in_progress','In progress'],['delivered','Delivered · 14 days']];
      return cols.map(([k,l])=>{
        let items=list.filter(r=>r.status===k);
        if(k==='delivered') items=items.filter(r=>dayDiff((r.needed_by||r.created_at).slice(0,10))>=-14);
        items.sort((a,b)=>(a.needed_by||'').localeCompare(b.needed_by||''));
        return `<div class="col"><div class="col-h"><h3>${l}</h3><span class="n">${items.length}</span></div>
          ${items.map(reqCard).join('')||'<div class="empty">None</div>'}</div>`;
      }).join('');
    },
  },
};
function reqCard(r){
  const hs=S.hauls.filter(h=>h.request_id===r.id&&h.status!=='cancelled');
  const del=hs.filter(h=>h.status==='delivered').reduce((s,h)=>s+Number(h.volume_yd),0);
  const sched=hs.reduce((s,h)=>s+Number(h.volume_yd),0);
  const remaining=r1(Math.max(0,r.qty_yd-sched));
  const late=r.status!=='delivered'&&dayDiff(r.needed_by)<0;
  const canD=can.dispatch(r.method)&&r.status!=='delivered';
  const open=UI.openHaulFor===r.id;
  return `<article class="card">
    <div class="top-line"><span class="chip ${r.method==='bulk'?'c-info':'c-acc'}">${METHOD[r.method].label}</span>${late?'<span class="chip c-bad">Late</span>':''}</div>
    <div><div class="big num">${fmtYd(r.qty_yd)}</div><div style="font-weight:600">${esc(prodName(r.product_id))}</div></div>
    <div class="meta">Needed ${esc(whenDate(r.needed_by))} · ${esc(METHOD[r.method].who)} dispatches${r.notes?'<br>'+esc(r.notes):''}</div>
    ${r.method==='bulk'&&remaining>0?(()=>{ const sug=trucks().map(t=>{ const c=truckCap(t.no,r.product_id,'dry'); return c?`${Math.ceil(remaining/c)} load${Math.ceil(remaining/c)>1?'s':''} on ${esc(t.no)}`:null; }).filter(Boolean);
      return sug.length?`<div class="meta">≈ ${sug.join(' · ')} <span class="muted">(dry)</span></div>`:`<div class="meta" style="color:var(--warn)">No truck capacity on file for this product</div>`; })():''}
    ${hs.length?`<div class="progress" title="${fmtN(del)} of ${fmtN(r.qty_yd)} yd³ delivered"><i style="width:${Math.min(100,del/r.qty_yd*100)}%"></i></div>
      <div class="hauls-mini">${hs.map(h=>`<div><span>Truck ${esc(h.truck_no)}${h.loads>1?' × '+h.loads:''} · ${esc(fmtDate(h.haul_on))}</span><span class="num">${fmtN(h.volume_yd)} yd³ ${statusChip(h.status)}</span></div>`).join('')}</div>`:''}
    ${canD?(open?`<form class="form inline-form" data-form="haul" data-req="${r.id}" data-pid="${r.product_id}" data-remaining="${remaining}" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">
        ${truckFields(r.product_id,{remaining,method:r.method})}
        <label class="field"><span>Date</span><input name="haul_on" type="date" value="${dayDiff(r.needed_by)>=0?r.needed_by:isoDay()}"></label>
        <div class="form-actions full"><button class="btn primary sm">Schedule haul</button><button type="button" class="btn sm ghost" data-act="haulClose">Close</button></div></form>`
      :`<div class="form-actions"><button class="btn sm primary" data-act="haulOpen" data-id="${r.id}">${hs.length?'Add another truck':'Schedule truck'}</button>
        ${r.status==='requested'&&can.request()?confirmBtn('cancelReq','Cancel request',`data-id="${r.id}"`,'ghost'):''}</div>`):''}
    <div class="meta">Requested by ${esc(r.created_by_name||'—')}</div>
  </article>`;
}

/* ---------- Hauls ---------- */
VIEWS.hauls={
  shell:()=>`<section class="view">
    <div class="summary" data-dyn="hSummary"></div>
    ${can.haul()?`<details class="panel panel-pad adder">
      <summary class="sec-head"><h2>Log a haul</h2><span class="btn sm primary">Add haul</span></summary>
      <form class="form" data-form="haulFree" autocomplete="off">

        ${truckFields(null)}
        <label class="field"><span>Date</span><input id="hf-date" name="haul_on" type="date" value="${isoDay()}"></label>
        <label class="field"><span>Hauled by</span><select id="hf-method" name="method">${has('hauling')&&!has('admin')?'<option value="bulk">Bulk truck</option>':'<option value="bulk">Bulk truck</option><option value="slinger">Slinger</option>'}</select></label>
        <label class="field"><span>Status</span><select id="hf-status" name="status"><option value="scheduled">Scheduled</option><option value="delivered">Already delivered</option></select></label>
        <label class="field full"><span>For request (optional)</span><select id="hf-req" name="request_id"><option value="">Not tied to a request</option>${S.backfills.filter(r=>!['delivered','cancelled'].includes(r.status)).map(r=>`<option value="${r.id}">${esc(prodName(r.product_id))} · ${fmtYd(r.qty_yd)} · needed ${esc(fmtDate(r.needed_by))}</option>`).join('')}</select></label>
        <div class="form-actions full"><button class="btn primary">Save haul</button><span class="hint">Delivered hauls add to the bin right away.</span></div>
      </form></details>`:''}
    <div class="sec"><div class="sec-head"><h2>Hauls</h2><div class="filters" data-dyn="hFilters"></div></div>
      <div class="rows" data-dyn="hList"></div></div>
  </section>`,
  dyn:{
    hSummary(){
      const wk=S.hauls.filter(h=>h.status==='delivered'&&dayDiff(h.haul_on)>-7);
      const yd=wk.reduce((s,h)=>s+Number(h.volume_yd),0);
      const trucks={}; wk.forEach(h=>trucks[h.truck_no]=(trucks[h.truck_no]||0)+Number(h.volume_yd));
      const top=Object.entries(trucks).sort((a,b)=>b[1]-a[1])[0];
      const up=D.openHauls;
      return `<div><span class="k">Delivered · 7 days</span><span class="v num">${fmtN(yd)}<small>yd³</small></span><span class="s">${wk.length} loads</span></div>
        <div><span class="k">Scheduled</span><span class="v num">${up.filter(h=>h.status==='scheduled').length}</span><span class="s">${fmtYd(up.filter(h=>h.status==='scheduled').reduce((s,h)=>s+Number(h.volume_yd),0))}</span></div>
        <div><span class="k">En route</span><span class="v num">${up.filter(h=>h.status==='en_route').length}</span><span class="s">On the road now</span></div>
        <div><span class="k">Top truck · 7 days</span><span class="v num">${top?esc(top[0]):'—'}</span><span class="s">${top?fmtYd(top[1]):'No deliveries yet'}</span></div>`;
    },
    hFilters(){ return [['upcoming','Upcoming'],['delivered','Delivered'],['all','All']].map(([k,l])=>`<button data-act="haulFilter" data-v="${k}" aria-pressed="${UI.haulFilter===k}">${l}</button>`).join(''); },
    hList(){
      const f=UI.haulFilter;
      const list=S.hauls.filter(h=>f==='all'||(f==='upcoming'?['scheduled','en_route'].includes(h.status):h.status==='delivered'))
        .sort((a,b)=>f==='upcoming'?a.haul_on.localeCompare(b.haul_on):b.haul_on.localeCompare(a.haul_on)).slice(0,200);
      if(!list.length) return `<div class="empty">${f==='upcoming'?'No hauls scheduled.':'No hauls to show.'}</div>`;
      return list.map(h=>{
        const mine=can.dispatch(h.method)||has('admin','inventory');
        let act='';
        if(mine){
          if(h.status==='scheduled') act+=`<button class="btn sm" data-act="haulStatus" data-v="en_route" data-id="${h.id}">En route</button>`;
          if(['scheduled','en_route'].includes(h.status)) act+=`<button class="btn sm primary" data-act="haulStatus" data-v="delivered" data-id="${h.id}">Delivered</button>`+confirmBtn('haulCancel','Cancel',`data-id="${h.id}"`,'ghost');
          if(h.status==='delivered') act+=confirmBtn('haulUndo','Undo delivery',`data-id="${h.id}"`,'ghost');
        }
        return `<div class="row ${h.status==='cancelled'?'dim':''}">
          <span class="chip ${h.method==='bulk'?'c-info':'c-acc'}">${METHOD[h.method].label}</span>
          <div class="main"><span class="t">${esc(prodName(h.product_id))}</span><span class="m">Truck ${esc(h.truck_no)}${h.loads>1?' · '+h.loads+' loads':''}${h.conditions?' · '+esc(h.conditions):''}${h.request_id?' · for a product order':''}${h.created_by_name?' · '+esc(h.created_by_name):''}</span></div>
          <span class="vol">${fmtN(h.volume_yd)} yd³<small>${fmtUnits(h.volume_yd)}</small></span>
          <span class="date">${esc(fmtDate(h.haul_on))}</span>
          <span class="st">${statusChip(h.status)}</span>
          <span class="act">${act}</span></div>`;
      }).join('');
    },
  },
};

  },

function header(){

  const badge=t=> t==='pulls'&&pullBadge&&can.pull()?`<span class="badge">${pullBadge}</span>`

    ${A.mode==='demo'?`<div class="demo-note"><div class="wrap"><b>Demo mode.</b>${window.__offlineNote?'<span>Couldn\'t reach the live Supabase database from here, so this is showing example data.</span>':''}<span>Bins, products and orders here are examples, not live yard figures. Switch people in the top bar to see each role.</span></div></div>`:''}`;

function render(){
  if(!tabsFor().includes(UI.tab)) UI.tab=tabsFor()[0];
  $('#app').innerHTML=header()+`<main class="wrap" id="main">${VIEWS[UI.tab].shell()}</main>`;
  renderDyn(true);

let dynPending=false;
function renderDyn(force){
  const main=$('#main'); if(!main) return;
  const ae=document.activeElement;
  if(!force && ae && ae.closest('[data-dyn]') && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)){ dynPending=true; return; }
  dynPending=false;
  const v=VIEWS[UI.tab];
  main.querySelectorAll('[data-dyn]').forEach(el=>{ const fn=v.dyn[el.dataset.dyn]; if(fn) el.innerHTML=fn(); });
  const det=$('#bin-detail'); const sheet=!!(det&&UI.tab==='yard'&&UI.selBin&&isPhone());
  if(det) det.classList.toggle('sheet',sheet); document.body.classList.toggle('sheet-open',sheet);
  document.querySelectorAll('[data-hint]').forEach(updateHint);
}
document.addEventListener('click',e=>{ if(document.body.classList.contains('sheet-open')&&e.target===document.body){ UI.selBin=null; renderDyn(true); } });
(()=>{ try{ const mq=window.matchMedia('(max-width: 720px)'); const h=()=>{ if(S&&UI.tab==='yard') renderDyn(true); }; mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h); }catch{} })();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&UI.selBin){ UI.selBin=null; renderDyn(true); } });
document.addEventListener('focusout',()=>setTimeout(()=>{ if(dynPending) renderDyn(); },50));

async function reload({shell=false}={}){
  S=await A.load(); derive();
  if(shell) render(); else { const nav=$('.top'); if(nav) nav.outerHTML=header().split('</header>')[0]+'</header>'; renderDyn(); }
}
function updateHint(sel){
  const out=$('#'+sel.dataset.hint); if(!out) return;
  const s=D.stats[sel.dataset.hintProduct?D.defaultBin(sel.value):sel.value];
  if(!s){ out.textContent=''; out.classList.remove('warn'); return; }
  out.textContent=`${fmtYd(s.onHand)} on hand${s.inc?' · '+fmtN(s.inc)+' yd³ incoming':''}`;
  out.classList.toggle('warn', s.avail<=0);
}

async function run(fn, ok){
  try{ await fn(); if(ok) toast(ok); await reload(); }
  catch(e){ console.error(e); toast(e.message||'Something went wrong. Try again.', true); await reload().catch(()=>{}); }
}

      `Shopify ${n}: ${fmtYd(yd)} ${p.shopify_titles[0]}${p.shopify_variant_match?' ('+p.shopify_variant_match+')':''} drawn from ${b.code}.`);

  cancelReq(d){ run(()=>A.update('backfill_requests',d.id,{status:'cancelled'}),'Request cancelled.'); },

    run(async()=>{

function truckOf(fd){ const v=fd.get('truck_sel'); return v==='other'?String(fd.get('truck_other')||'').trim():String(v||'').trim(); }
const CHANGE={
  haulTouch(el){ el.dataset.touched='1'; },

    const f=el.closest('form'); if(!f) return;
    const sel=f.querySelector('[name=truck_sel]'), other=f.querySelector('[data-other-truck]');
    if(other){ other.hidden=sel.value!=='other'; f.querySelector('[name=truck_other]').required=sel.value==='other'; }
    const pid=f.dataset.pid||f.querySelector('[name=product_id]')?.value; const cond=f.querySelector('[name=conditions]').value;
    const loadsEl=f.querySelector('[name=loads]'), vol=f.querySelector('[name=volume]'), hint=f.querySelector('[data-truck-hint]');
    const cap=sel.value==='other'?null:truckCap(sel.value,pid,cond);
    if(el===sel||el.name==='conditions'||el.name==='product_id'){
      const rem=Number(f.dataset.remaining)||0; if(cap&&rem&&el!==loadsEl) loadsEl.value=Math.max(1,Math.ceil(rem/cap));
    }
    const n=Math.max(1,parseInt(loadsEl.value,10)||1);
    if(cap){ vol.value=r1(n*cap); delete vol.dataset.touched;
      hint.textContent=`Truck ${sel.value} carries ${fmtN(cap)} yd³ (${fmtUnits(cap)}) of ${HAUL_GROUPS[D.product[pid]?.haul_group]||'this product'} ${cond} per load · ${n} load${n>1?'s':''} = ${fmtYd(n*cap)}`;
      hint.classList.remove('warn'); }
    else { hint.textContent = !pid ? '' : sel.value==='other' ? 'Enter the volume for this truck.' : `No capacity on file for ${prodName(pid)} on Truck ${sel.value}. Enter the volume.`; hint.classList.toggle('warn',!!pid&&sel.value!=='other'); }

  async trucks(fd,f){
    const old=trucks(); const list=old.map(t=>({no:t.no,cap:{}}));
    const toYdKeep=(u,prev)=>{ if(!(u>0)) return null; const y=u*ydu(); return prev&&Math.abs(prev-y)<0.05?prev:Math.round(y*100)/100; };
    list.forEach((t,i)=>Object.keys(HAUL_GROUPS).forEach(g=>{ const pc=old[i].cap?.[g]||{};
      const d=toYdKeep(Number(fd.get(`${t.no}|${g}|dry`)),pc.dry), w=toYdKeep(Number(fd.get(`${t.no}|${g}|wet`)),pc.wet);
      if(d||w) t.cap[g]={dry:d,wet:w}; }));
    const add=String(fd.get('new_truck')||'').trim(); if(add&&!list.some(t=>t.no===add)) list.push({no:add,cap:{}});
    await run(()=>A.setSetting('trucks',list),'Trucks saved.'); render();
  },
  async adjust(fd,f){
    const bin=D.bin[fd.get('bin_id')]; const v=toYd(fd); const cur=D.stats[bin.id].onHand;
    const isCount=fd.get('mode')==='count';
    const delta=r1(isCount?v-cur:v);
    if(!delta){ toast('No change. The bin already reads '+fmtYd(cur)+'.'); return; }
    await run(()=>A.insert('movements',{bin_id:bin.id,product_id:bin.product_id,qty_yd:delta,kind:isCount?'count':'adjustment',occurred_on:isoDay(),
      note:(isCount?`Count: ${fmtN(v)} yd³ (was ${fmtN(cur)})`:'Adjustment')+(fd.get('note').trim()?' — '+fd.get('note').trim():'')}),
      `${bin.code} ${isCount?'set to '+fmtYd(v):'adjusted '+signed(delta)+' yd³'}.`);
    f.reset();
  },
  async mapLine(fd,f){
    const line=S.shopifyLines.find(l=>l.id===f.dataset.id); const pid=fd.get('product_id'); const ydEach=r1(fd.get('yd_each'));
    UI.mapLine=null;
    await run(async()=>{
      await A.update('shopify_order_lines',line.id,{product_id:pid,yd_each:ydEach,qty_yd:r1(ydEach*line.quantity),status:'pulled'});
      if(fd.get('link')){
        const prod=D.product[pid]; const titles=[...new Set([...(prod.shopify_titles||[]),line.title].filter(Boolean))];
        await A.update('products',pid,{shopify_titles:titles,...(!prod.shopify_product_id&&line.shopify_product_id?{shopify_product_id:line.shopify_product_id}:{})});
        const same=x=>x.id!==line.id&&x.status==='unmapped'&&x.yd_each&&((line.title&&String(x.title).toLowerCase()===String(line.title).toLowerCase())||(line.shopify_product_id&&String(x.shopify_product_id)===String(line.shopify_product_id)));
        for(const o of S.shopifyLines.filter(same))
          await A.update('shopify_order_lines',o.id,{product_id:pid,qty_yd:r1(o.yd_each*o.quantity),status:'pulled'});
      }
    },'Linked. The order drew from inventory.');
  },
  async bin(fd,f){
    const n=k=>{ const v=fd.get(k); return v===''||v==null?null:Number(v); };
    const row={code:fd.get('code').trim(),product_id:fd.get('product_id')||null,capacity_yd:r1(fd.get('capacity_yd')),reorder_yd:r1(fd.get('reorder_yd')),sort:Number(fd.get('sort'))||0,active:!!fd.get('active'),map_x:n('map_x'),map_y:n('map_y'),map_w:1,map_h:n('map_h')||3};
    const id=f.dataset.id;
    UI.editBin=null;
    await run(()=>id?A.update('bins',id,row):A.insert('bins',row), id?'Bin saved.':'Bin added.');
    render();
  },
  async product(fd,f){
    const shop=fd.get('shopify_product_id').trim();
    const titles=[...new Set(fd.get('shopify_titles').split(',').map(t=>t.trim()).filter(Boolean))];
    const row={name:fd.get('name').trim(),sku:fd.get('sku').trim()||null,shopify_product_id:shop?Number(shop):null,shopify_titles:titles,shopify_variant_match:fd.get('shopify_variant_match').trim()||null,haul_group:fd.get('haul_group')||null};
    const id=f.dataset.id; UI.editProduct=null;
    await run(()=>id?A.update('products',id,row):A.insert('products',{...row,active:true}), id?'Product saved.':'Product added.');
    render();
  },
  async units(fd){
    const sizes=[...new Set(String(fd.get('totes')).split(',').map(x=>Number(x.trim())).filter(n=>n>0))].sort((a,b)=>a-b);
    await run(async()=>{ await A.setSetting('yd_per_unit',Number(fd.get('yd'))); if(sizes.length) await A.setSetting('tote_sizes',sizes); },'Units and tote sizes saved.'); render();
  },
  async config(fd){
    const url=fd.get('url').trim(), key=fd.get('key').trim();
    if(!url||!key){ toast('Enter both the project URL and the anon key.',true); return; }
    store.set('ryt-config',{url,key}); store.del('ryt-force-demo'); location.reload();
  },
};
document.addEventListener('submit',e=>{
  const f=e.target; if(!f.dataset.form) return; e.preventDefault();
  const btn=f.querySelector('button:not([type="button"])'); if(btn) btn.disabled=true;
  Promise.resolve(FORM[f.dataset.form](new FormData(f),f)).finally(()=>{ if(btn&&btn.isConnected) btn.disabled=false; });
});

function signInScreen(){
  $('#app').innerHTML=`<div class="signin panel sec">
    <h1 style="font-size:2rem;text-transform:uppercase">Retail Yard</h1>
    <p class="muted" style="margin:0">Sign in with your Rexius email. We'll send you a 6-digit code.</p>
    <form class="form" id="si-form" style="grid-template-columns:1fr">
      <label class="field"><span>Email</span><input id="si-email" type="email" required autocomplete="email"></label>
      <label class="field" id="si-code-wrap" hidden><span>Code from the email</span><input id="si-code" inputmode="numeric" autocomplete="one-time-code"></label>
      <div class="form-actions"><button class="btn primary" id="si-btn">Send code</button><span class="hint" id="si-hint"></span></div>
    </form>
    <button class="btn sm ghost" style="justify-self:start" data-act="disconnect">Use demo data instead</button></div>`;
  let sent=false;
  $('#si-form').addEventListener('submit',async e=>{
    e.preventDefault(); const email=$('#si-email').value.trim(); const hint=$('#si-hint');
    try{
      if(!sent){ await A.sendCode(email); sent=true; $('#si-code-wrap').hidden=false; $('#si-btn').textContent='Sign in'; hint.textContent='Code sent to '+email+'.'; $('#si-code').focus(); }
      else { await A.verify(email,$('#si-code').value.trim()); await start(); }
    }catch(err){ hint.textContent=/database error|signups not allowed/i.test(err.message||'')?'Use your @rexius.com email address.':(err.message||'Something went wrong. Try again.'); hint.classList.add('warn'); }
  });
}
async function start(){
  try{
    if(A.mode==='live' && !(await A.session())) return signInScreen();
    S=await A.load(); derive(); render();
    if(A.mode==='live'){
      let t; A.subscribe(()=>{ clearTimeout(t); t=setTimeout(()=>reload().catch(console.error),400); });
    }
  }catch(e){
    console.error(e);
    $('#app').innerHTML=`<div class="signin panel sec"><h2>Couldn't load the yard</h2><p>${esc(e.message||e)}</p>
      <p class="muted">Check the Supabase URL and key in Setup, and that schema.sql has been run.</p>
      <button class="btn" data-act="disconnect">Switch to demo data</button></div>`;
  }
}
async function reachable(url,key){
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch(url.replace(/\/$/,'')+'/auth/v1/health',{headers:{apikey:key},signal:ctl.signal}); clearTimeout(t);
    return r.ok||r.status<500;
  }catch{ return false; }
}
(async function boot(){
  const cfg=store.get('ryt-config',null);
  const url=cfg?.url||SUPABASE_URL, key=cfg?.key||SUPABASE_ANON_KEY;
  const forceDemo=store.get('ryt-force-demo',false);
  if(url&&key&&!forceDemo){
    if(!window.supabase){
      $('#app').innerHTML=`<div class="signin panel sec"><h2>Couldn't load the sign-in library</h2>
        <p>The page couldn't download the Supabase library from cdn.jsdelivr.net, so it can't connect to the yard database.</p>
        <p class="muted">Check the internet connection or a network filter blocking cdn.jsdelivr.net, then reload.</p>
        <div class="form-actions"><button class="btn primary" onclick="location.reload()">Reload</button><button class="btn ghost" data-act="disconnect">Use demo data</button></div></div>`;
      return;
    }
    if(await reachable(url,key)){ A=LiveAdapter({url,key}); return start(); }
    A=DemoAdapter(); window.__offlineNote=true;
  } else A=DemoAdapter();
  start();
})();
