<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fxajnoeoclnbggbkkpxn.supabase.co wss://fxajnoeoclnbggbkkpxn.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<title>Rexius Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="../shared/config.js?v=1"></script>
<script src="../retail-yard/vendor/supabase.js"></script>
<script src="../shared/rexius-core.js?v=1"></script>
<style>
/* Same tokens as the hub and Retail Yard. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunken:#E3E8E1; --ink:#17201A; --muted:#5A675E; --line:#D0D8CE;
  --accent:#2D6A43; --accent-ink:#FFFFFF; --ok:#2E7D4F; --warn:#B7741A; --bad:#B23A30; --bar:#17201A; --bar-ink:#EEF1EC;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111613; --surface:#18201B; --sunken:#212A24; --ink:#E5EBE6; --muted:#98A69D; --line:#2E3832;
  --accent:#6DBB86; --accent-ink:#0D1510; --ok:#6CC08E; --warn:#E3A94B; --bad:#EE7B6F; --bar:#0A0E0B; --bar-ink:#E5EBE6; color-scheme:dark; } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);min-height:100vh}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.05em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
main.wrap{padding-block:20px 56px}

.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.head h1{font-size:2rem}
.head .count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools .sp{flex:1}
.tools input[type=search],.tools select{padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tools input[type=search]{min-width:220px;flex:0 1 300px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:.78rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;font-family:var(--f-mono);font-weight:500;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--sunken);white-space:nowrap}
th.c,td.c{text-align:center}
th.n,td.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr.off td{opacity:.5}
td.name{min-width:220px}
td.name b{font-weight:600}
.sub{display:block;font-size:.76rem;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wt{width:88px;padding:5px 7px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono)}
.wt.saved{border-color:var(--ok)}
.wt.err{border-color:var(--bad)}
.tag{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
input[type=checkbox]:disabled{cursor:default}
.empty{padding:28px;text-align:center;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.notice{max-width:620px;margin:6vh auto 0;display:grid;gap:10px}
.hint{font-size:.85rem;color:var(--bad);min-height:1.2em}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunken);padding:1px 5px;border-radius:4px}

/* dialogs */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,11,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal{width:min(100%,560px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.modal.wide{width:min(100%,860px)}
.modal h2{font-size:1.3rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;font-size:.8rem;font-weight:600}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-weight:400;font-size:.95rem;width:100%}
.field small{font-weight:400;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;background:var(--bg)}
.drop.over{border-color:var(--accent)}
textarea.paste{width:100%;min-height:110px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-family:var(--f-mono);font-size:.82rem}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.or{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--bar);color:var(--bar-ink);padding:9px 16px;border-radius:var(--r);font-size:.88rem;box-shadow:0 4px 18px rgba(0,0,0,.25)}
@media (max-width:560px){ .form{grid-template-columns:1fr} }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><p class="muted">Loading…</p></main>
<div id="modalRoot"></div>
<noscript><p style="padding:16px">This page needs JavaScript turned on.</p></noscript>
<script src="products.js?v=1"></script>
</body>
</html>
