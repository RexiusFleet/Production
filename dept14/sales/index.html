<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dept 14 - Specialty Product Sales</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sales page for Dept 14 orchid bark: sign in → Inventory (active orders + bins) · Sales log · Calendar.
   Sales add and edit their orders (until shipped) and the shipping info; everything else is view only. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunken:#EAECE7; --ink:#1B211D; --muted:#5F6A63; --line:#DADFD8; --line-strong:#C3CAC1;
  --accent:#2F6B47; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6; --bar:#1B211D; --bar-ink:#F3F4F1; --bad:#B23A30;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1A201C; --sunken:#222924; --ink:#E6EBE7; --muted:#9AA69F; --line:#2D3530; --line-strong:#3B4540;
  --accent:#74BF8E; --accent-ink:#0E1511; --accent-soft:#1F3227; --bar:#0B0E0C; --bar-ink:#E6EBE7; --bad:#EE7B6F; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A201C; --sunken:#222924; --ink:#E6EBE7; --muted:#9AA69F; --line:#2D3530; --line-strong:#3B4540;
  --accent:#74BF8E; --accent-ink:#0E1511; --accent-soft:#1F3227; --bar:#0B0E0C; --bar-ink:#E6EBE7; --bad:#EE7B6F; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.02em}

/* sign-in (same as the manager dashboard) */
.login{--mb-bg:#f1f3ef;--mb-surface:#fff;--mb-fg:#182019;--mb-muted:#5e6a61;--mb-line:#d3dad2;--mb-line-strong:#aab4ab;--mb-accent:#2c7a44;--mb-accent-ink:#fff;--mb-danger:#b23a3a;--mb-shadow:0 6px 24px rgba(20,30,22,.12);
  position:fixed;inset:0;z-index:60;background:var(--mb-bg);color:var(--mb-fg);display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login{--mb-bg:#141814;--mb-surface:#1d231e;--mb-fg:#e7ece6;--mb-muted:#9ba69c;--mb-line:#2f382f;--mb-line-strong:#4a564b;--mb-accent:#4fb56e;--mb-accent-ink:#0f1a12;--mb-danger:#e06666;--mb-shadow:0 6px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"] .login{--mb-bg:#141814;--mb-surface:#1d231e;--mb-fg:#e7ece6;--mb-muted:#9ba69c;--mb-line:#2f382f;--mb-line-strong:#4a564b;--mb-accent:#4fb56e;--mb-accent-ink:#0f1a12;--mb-danger:#e06666;--mb-shadow:0 6px 24px rgba(0,0,0,.45)}
.login-card{background:var(--mb-surface);border:1px solid var(--mb-line);border-radius:10px;padding:24px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--mb-shadow)}
.login-card h2{margin:0;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:22px;line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
@media (max-width:440px){.login-card h2{white-space:normal}}
.login .hint{margin:0;font-size:12px}
.login .field{display:flex;flex-direction:column;gap:4px;min-width:0}
.login .field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mb-muted)}
.login .field input{border:1px solid var(--mb-line-strong);border-radius:6px;padding:8px 10px;background:var(--mb-bg);color:var(--mb-fg);font:inherit;width:100%}
.login .mb-btn{border:1px solid var(--mb-accent);background:var(--mb-accent);color:var(--mb-accent-ink);border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;line-height:1;cursor:pointer}
.login .mb-btn:disabled{opacity:.6;cursor:default}

/* top bar + tabs */
.top{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 20px 0;flex-wrap:wrap}
.brand{margin-right:auto;padding-bottom:10px}
.brand h1{font-size:1.6rem;text-transform:uppercase}
.who{font-size:.85rem;opacity:.8;margin-bottom:10px}
.signout{background:none;border:0;color:inherit;opacity:.8;cursor:pointer;font:inherit;text-decoration:underline;padding:0}
nav.lines{display:flex;gap:4px;padding:0 20px;width:100%;align-items:flex-end}
nav.lines button[role=tab]{background:none;border:0;color:inherit;opacity:.6;padding:10px 16px 9px;font:600 1.05rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;border-bottom:3px solid transparent;cursor:pointer}
nav.lines button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent)}
nav.lines .input-btn{align-self:center;margin:0 0 4px auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 16px;font:700 .9rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;cursor:pointer}
main{padding:20px 20px 60px;display:grid;gap:20px}
.base{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:calc(100vh - 200px)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.toolbar .sp{flex:1}
.toolbar input[type=search]{border:1px solid var(--line-strong);border-radius:6px;padding:6px 10px;background:var(--surface);width:220px}
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 11px;font-size:.88rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.icon{width:32px;height:32px;padding:0;justify-content:center}
.empty{padding:40px;text-align:center;color:var(--muted)}
.loading-all{padding:40px;text-align:center;color:var(--muted)}

/* spreadsheet grid */
.grid-wrap{overflow-x:auto}
.grid{width:100%;border-collapse:collapse;font-size:.9rem}
.grid th{text-align:left;font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-strong);background:var(--sunken);white-space:nowrap}
.grid td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid td.r,.grid th.r{text-align:right}
.grid td.c,.grid th.c{text-align:center}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--accent-soft)}
.grid tr.done td{color:var(--muted)}
.tag{display:inline-block;font:600 .68rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;border:1px solid var(--line-strong);white-space:nowrap}
.tag.ready{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag.shipped{background:color-mix(in srgb,#E3A94B 20%,transparent);border-color:#E3A94B}
.tag.done{opacity:.7}

/* active orders */
.ao{padding:16px 18px 18px 20px;border-bottom:1px solid var(--line);display:grid;gap:12px;overflow-x:auto}
.ao-h{display:flex;align-items:center;gap:10px}
.ao-h h3{font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em}
.ao .grid{min-width:760px}

/* bin map (view only) */
.binmap-wrap{overflow-x:auto;padding:16px 18px}
.binmap-wrap+.binmap-wrap{padding-top:0}
.inv-div{border:0;border-top:1px solid var(--line-strong);margin:4px 18px}
.binmap{border-collapse:collapse;font-size:.88rem;table-layout:fixed}
.binmap th,.binmap td{border:1px solid var(--line);padding:6px 10px;text-align:right;vertical-align:top}
.binmap .bh{padding:9px 10px;font:700 .82rem/1.2 var(--f-mono);letter-spacing:.05em;color:#fff;text-align:center;text-transform:uppercase}
.binmap .bh.green{background:#274E13}.binmap .bh.dried{background:#C4761E}.binmap .bh.material{background:#6B4E2E}.binmap .bh.bagged,.binmap .bh.totes{background:#5E8F4A}
.bm-two{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.bm-two>.n{text-align:left}
.bm-after{display:grid;justify-items:end;border-left:1px solid color-mix(in srgb,var(--ink) 14%,transparent);padding-left:8px}
.binmap .n{font:700 clamp(1rem,1.25vw,1.5rem)/1.1 var(--f-display);white-space:nowrap}
.binmap .n small{font:500 .7rem var(--f-body);color:var(--muted);margin-left:3px}
.binmap .n.neg{color:var(--bad)}
.bm-lab{font:500 .58rem/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.bm-note{text-align:left!important;font-size:.78rem;font-style:italic;color:var(--muted)}
@media (max-width:1100px){.binmap{width:auto!important;table-layout:auto}.binmap .bh{min-width:170px}}

/* calendar */
.cal{padding:14px 18px 16px;display:grid;gap:8px}
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h h3{margin:0 4px;min-width:150px;text-align:center;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em}
.cal-w,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w span{font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 6px}
.cal-d{all:unset;box-sizing:border-box;cursor:pointer;min-height:104px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;display:flex;flex-direction:column;gap:1px;background:var(--surface);font-size:.76rem;line-height:1.3;overflow:hidden;min-width:0}
.cal-d:hover,.cal-d:focus-visible{border-color:var(--accent)}
.cal-d.out{opacity:.4}
.cal-d.we{background:var(--sunken)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-n{font:700 .85rem/1.2 var(--f-mono);margin-bottom:2px}
.cal-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-l b{font-weight:600}
.cal-l.c-dry b{color:#C4761E}.cal-l.c-pick b{color:#4E8F3A}.cal-l.c-bag b{color:#5E8F4A}
.cal-o{font-size:.7rem;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,#E3A94B 22%,transparent)}
.cal-o.ship{background:var(--accent-soft)}
.cal-plan{font-size:.72rem;font-weight:600;background:color-mix(in srgb,var(--accent) 16%,transparent);border-left:3px solid var(--accent);border-radius:3px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-note{font-size:.7rem;font-style:italic;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-off{font:600 .62rem/1 var(--f-mono);text-transform:uppercase;color:var(--muted);margin-left:6px}
.sect{font:600 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}

/* windows */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:min(620px,100%);border:1px solid var(--line-strong)}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:1.25rem}
.modal-b{padding:18px 20px 20px;display:grid;gap:16px}
.modal-b>table{width:100%}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.in-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.field{display:grid;gap:6px;align-content:start;min-width:0}
.field>span{font:600 .7rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field.full{grid-column:1/-1}
.in-form input,.in-form select,.in-form textarea{width:100%;height:40px;border:1px solid var(--line-strong);border-radius:6px;padding:0 10px;background:var(--surface)}
.in-form textarea{height:auto;padding:8px 10px;min-height:64px;resize:vertical}
.in-form input[type=number]::-webkit-inner-spin-button,.in-form input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.in-form input[type=number]{-moz-appearance:textfield}
.in-form .bad{border-color:var(--bad)}
.in-sfx{position:relative;display:block}
.in-sfx input{padding-right:58px}
.in-sfx i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.82rem;color:var(--muted);pointer-events:none}
.in-sect{grid-column:1/-1;font:600 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.ord-lines{width:100%;border-collapse:collapse}
.ord-lines th{text-align:left;font:600 .7rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 6px 6px 0}
.ord-lines td{padding:0 6px 8px 0;vertical-align:middle}
.ord-lines td:nth-child(2),.ord-lines th:nth-child(2){width:130px}
.ord-lines td.ord-load,.ord-lines th:nth-child(3){width:110px}
.ord-lines td:last-child{width:36px;padding-right:0}
.combo{position:relative}
.combo input{width:100%}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:50;list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .25);max-height:260px;overflow:auto}
.combo-list li{padding:7px 10px;border-radius:5px;cursor:pointer;font-size:.92rem}
.combo-list li:hover,.combo-list li.on{background:var(--accent-soft)}
.combo-list li.add{color:var(--accent);font-weight:600}
.in-err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-radius:6px;padding:8px 12px;font-weight:600}
.ro{font-size:.92rem}
.ro dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.ro dt{font:600 .7rem/1.6 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ro dd{margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:8px;z-index:70;font-size:.9rem;box-shadow:0 6px 20px rgb(0 0 0 / .3)}

@media (max-width:760px){
  .top{position:static}
  .top-in{gap:6px 10px;padding:10px 12px 0}
  .brand{width:100%;padding-bottom:4px}.brand h1{font-size:1.15rem}
  .who{font-size:.78rem;margin-bottom:6px}
  nav.lines{flex-wrap:wrap;padding:0 12px 10px;row-gap:8px}
  nav.lines button[role=tab]{padding:8px 10px 7px;font-size:.92rem}
  nav.lines .input-btn{flex:1 1 100%;margin:0;padding:10px}
  main{padding:14px 12px 50px}
  .toolbar input[type=search]{flex:1 1 140px;width:auto;min-width:0}
  .cal{padding:12px 10px}.cal-h h3{min-width:0;font-size:1rem}.cal-w span{padding:0 2px;font-size:.62rem}
  .cal-d{min-height:54px}.cal-l,.cal-o,.cal-note,.cal-plan{display:none}.cal-d.has::after{content:'';width:6px;height:6px;border-radius:99px;background:var(--accent);margin-top:2px}
  .scrim{padding:8px 6px}.modal-b{padding:12px}.modal-b>table{display:block;overflow-x:auto;max-width:100%}.modal-h,.modal-f{padding-left:12px;padding-right:12px}
}
@media (max-width:520px){.in-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <h2>Dept 14 - Specialty Product Sales</h2>
    <div class="field"><label for="lgEmail">Email</label><input id="lgEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lgPass">Password</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
    <div class="hint" id="loginErr" role="alert" style="color:var(--mb-danger)"></div>
    <button type="submit" class="mb-btn" id="lgBtn">Sign in</button>
  </form>
</div>
<div id="appShell" hidden>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Dept 14 - Specialty Product Sales</h1></div>
    <span class="who"><span id="whoEmail"></span> · <button type="button" class="signout" id="signOut">Sign out</button></span>
  </div>
  <nav class="lines" role="tablist" id="tabs">
    <button role="tab" data-tab="inv" aria-selected="true">Inventory</button>
    <button role="tab" data-tab="sales" aria-selected="false">Sales log</button>
    <button role="tab" data-tab="cal" aria-selected="false">Calendar</button>
    <button type="button" class="input-btn" id="addOrder">Sales input</button>
  </nav>
</header>
<main>
  <div class="loading-all" id="loading">Loading…</div>
  <section class="base" id="view" hidden></section>
</main>
</div>
<div id="modalRoot"></div>

<script>
/* =============================================================
   Dept 14 sales page (orchid bark). Same Supabase logins as the
   manager dashboard. Sales can add orders and change them (and their
   shipping info: carrier, ship date, freight) until they ship; the
   rest is view only. They never write ready / completed / ranking:
   the manager owns those on the dashboard.
   ============================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('d14s.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('d14s.'+k,JSON.stringify(v))}catch(e){}}};
const fmtN=(n,d=1)=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:d});
const fmtDate=s=>s?new Date(s+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}):'';
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const isoOf=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const toast=t=>{const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)};
const CFG=window.MIX_BOARD_CONFIG||{};
const sb=window.supabase&&CFG.SUPABASE_URL?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{db:{schema:'dept14'}}):null;
const must=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
async function all(table,select='*',filter){const out=[];for(let f=0;;f+=1000){let q=sb.from(table).select(select).range(f,f+999);if(filter)q=filter(q);const d=await must(q);out.push(...d);if(d.length<1000)break}return out}

/* ---------- data ---------- */
const D={bins:[],onhand:{},orders:[],dryer:[],picker:[],bagging:[],cal:[],customers:[],loadedAt:0};
/* Type-ahead box: typing fills in the best match and lists matches; a new name gets "Add". */
function combo(input,getList,onAdd){
  const wrap=document.createElement('div');wrap.className='combo';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);
  const ul=document.createElement('ul');ul.className='combo-list';ul.setAttribute('role','listbox');ul.hidden=true;wrap.appendChild(ul);
  input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','both');input.setAttribute('aria-expanded','false');input.autocomplete='off';
  let items=[],hi=-1;
  const norm=x=>x.toLowerCase().replace(/\s+/g,' ').trim();
  const close=()=>{ul.hidden=true;input.setAttribute('aria-expanded','false');hi=-1};
  const pick=v=>{input.value=v;close();input.dispatchEvent(new Event('change',{bubbles:true}))};
  const draw=(q)=>{const list=getList(),n=norm(q);
    const starts=list.filter(x=>norm(x).startsWith(n)),has=list.filter(x=>!norm(x).startsWith(n)&&norm(x).includes(n));
    items=(n?[...starts,...has]:list).slice(0,8).map(v=>({v}));
    if(n&&!starts.length&&!list.some(x=>norm(x)===n))items.push({v:q.trim(),add:true});
    ul.innerHTML=items.map((it,i)=>`<li role="option" data-i="${i}" class="${i===hi?'on':''} ${it.add?'add':''}">${it.add?`Add “${esc(it.v)}”`:esc(it.v)}</li>`).join('');
    ul.hidden=!items.length;input.setAttribute('aria-expanded',String(!ul.hidden))};
  input.addEventListener('input',e=>{hi=-1;const q=input.value;
    if(e.inputType&&e.inputType.startsWith('insert')&&q){const m=getList().find(x=>norm(x).startsWith(norm(q)));
      if(m&&m.length>q.length){input.value=m;input.setSelectionRange(q.length,m.length)}}
    draw(q)});
  input.addEventListener('focus',()=>draw(input.value));
  input.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==input)close()},120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(ul.hidden)draw(input.value);if(!items.length)return;
      hi=Math.max(0,Math.min(items.length-1,hi+(e.key==='ArrowDown'?1:-1)));
      ul.querySelectorAll('li').forEach((li,i)=>li.classList.toggle('on',i===hi));ul.children[hi]?.scrollIntoView({block:'nearest'});return}
    if(e.key==='Enter'&&!ul.hidden){e.preventDefault();e.stopPropagation();const it=items[hi>=0?hi:0];if(!it)return;if(it.add){onAdd&&onAdd(it.v)}pick(it.v);return}
    if(e.key==='Escape'&&!ul.hidden){e.stopPropagation();close()}
  });
  ul.addEventListener('mousedown',e=>{e.preventDefault();const li=e.target.closest('li');if(!li)return;const it=items[+li.dataset.i];if(it.add&&onAdd)onAdd(it.v);pick(it.v)});
}

const binName=id=>(D.bins.find(b=>b.id===id)||{}).name||'';

    lines:(o.order_lines||[]).map(l=>({bin:binName(l.bin_id),qty:+l.qty,load:l.load_type||''}))}));
  D.dryer=dryer.map(r=>({date:r.production_date,product:binName(r.product_bin_id),yin:+r.yards_in,yout:+r.yards_out,dest:r.destination,bin:binName(r.bin_id),totes:r.totes!=null?+r.totes:null,hours:+r.hours}));
  D.picker=picker.map(r=>({date:r.production_date,material:r.material,units:+r.units,yards:+r.yards,small:+r.small_green,medium:+r.medium_green,hours:+r.hours}));
  D.bagging=bagging.map(r=>({date:r.production_date,from:binName(r.from_bin_id),yards:+r.yards_used,pallets:+r.pallets,hours:+r.hours}));

}

    <dt>Sales order #</dt><dd>${esc(o.so)}</dd><dt>PO</dt><dd>${esc(o.po)}</dd>
    <dt>Products</dt><dd>${o.lines.map(l=>`${fmtN(l.qty,2)} ${unitOf(l.bin)} ${esc(l.bin)}${l.load?' · '+esc(l.load):''}`).join('<br>')}</dd>
    <dt>Carrier</dt><dd>${esc(o.carrier)}</dd><dt>Ship date</dt><dd>${fmtDate(o.shipDate)}</dd><dt>Freight</dt><dd>${o.freight!=null?'$'+fmtN(o.freight,2):''}</dd>
    ${o.done?`<dt>Completed</dt><dd>${fmtDate(o.doneOn)}</dd>`:''}
    <dt>Notes</dt><dd>${esc(o.notes)}</dd></dl></div>`,'<button class="btn" data-close>Close</button>');
}

/* ---------- windows ---------- */
function modal(title,body,foot,cls=''){
  $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="btn icon" data-close aria-label="Close">✕</button></div>
    <div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div></div>`;
}
const closeModal=()=>$('#modalRoot').innerHTML='';
$('#modalRoot').addEventListener('click',e=>{
  if(e.target.id==='scrim'||e.target.closest('[data-close]'))return closeModal();
  const r=e.target.closest('tr[data-order]');if(r){const o=D.orders.find(x=>x.id===r.dataset.order);if(o)openOrder(o)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal()});
$('#view').addEventListener('click',e=>{
  const r=e.target.closest('tr[data-order]');if(r){const o=D.orders.find(x=>x.id===r.dataset.order);if(o)openOrder(o);return}
  const n=e.target.closest('[data-nav]');if(n){const k=+n.dataset.nav;if(!k)UI.month=today().slice(0,7);else{const [y,m]=UI.month.split('-').map(Number);const d=new Date(y,m-1+k,1,12);UI.month=isoOf(d).slice(0,7)}renderCal();return}
  const d=e.target.closest('[data-day]');if(d)openDay(d.dataset.day);
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;UI.tab=b.dataset.tab;store.set('tab',UI.tab);render()});
$('#addOrder').onclick=()=>openOrder(null);

/* ---------- sign in ---------- */
async function refresh(){await load();render()}
function showLogin(msg){$('#login').hidden=false;$('#appShell').hidden=true;$('#loginErr').textContent=msg||'';$('#lgEmail').focus()}
async function boot(){
  if(!sb){document.body.innerHTML='<p style="padding:30px">The page can’t reach the database.</p>';return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  $('#whoEmail').textContent=session.user.email||'';
  $('#login').hidden=true;$('#appShell').hidden=false;
  try{await load()}catch(e){$('#loading').textContent='Couldn’t load the data: '+(e.message||e);return}
  $('#loading').hidden=true;$('#view').hidden=false;render();
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();const btn=$('#lgBtn');btn.disabled=true;btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:$('#lgPass').value});
  btn.disabled=false;btn.textContent='Sign in';
  if(error)return showLogin(error.message==='Invalid login credentials'?'That email and password don’t match a login.':error.message);
  $('#lgPass').value='';boot();
};
$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!D.loadedAt||$('#modalRoot').innerHTML||Date.now()-D.loadedAt<60000)return;
  try{await refresh()}catch(e){}
});
boot();
</script>
</body>
