<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dept 14 - Specialty Product Production</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: dark top bar → line tabs (Biochar / Orchid) → customizable highlight cards → table tabs → Airtable-style grid. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunken:#EAECE7; --ink:#1B211D; --muted:#5F6A63; --faint:#8A948D; --line:#DADFD8; --line-strong:#C3CAC1;
  --accent:#2F6B47; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6; --bar:#1B211D; --bar-ink:#F3F4F1;
  --ok:#2E7D4F; --warn:#B7741A; --bad:#B23A30;
  --t-wash-bg:#DDF0F4; --t-wash:#1F5F6E; --t-sock-bg:#E8E4F7; --t-sock:#4A3C8C; --t-bag-bg:#F7E7DA; --t-bag:#7A4419;
  --t-tag-bg:#ECEEE9; --t-tag:#3E4741;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1A201C; --sunken:#222924; --ink:#E6EBE7; --muted:#9AA69F; --faint:#6F7A73; --line:#2D3530; --line-strong:#3B4540;
  --accent:#74BF8E; --accent-ink:#0E1511; --accent-soft:#1F3227; --bar:#0B0E0C; --bar-ink:#E6EBE7;
  --ok:#6CC08E; --warn:#E3A94B; --bad:#EE7B6F;
  --t-wash-bg:#173740; --t-wash:#9ED6E3; --t-sock-bg:#2B2650; --t-sock:#C7BEF2; --t-bag-bg:#3D2A1B; --t-bag:#F0C49E;
  --t-tag-bg:#29302B; --t-tag:#C9D1CB; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A201C; --sunken:#222924; --ink:#E6EBE7; --muted:#9AA69F; --faint:#6F7A73; --line:#2D3530; --line-strong:#3B4540;
  --accent:#74BF8E; --accent-ink:#0E1511; --accent-soft:#1F3227; --bar:#0B0E0C; --bar-ink:#E6EBE7;
  --ok:#6CC08E; --warn:#E3A94B; --bad:#EE7B6F;
  --t-wash-bg:#173740; --t-wash:#9ED6E3; --t-sock-bg:#2B2650; --t-sock:#C7BEF2; --t-bag-bg:#3D2A1B; --t-bag:#F0C49E;
  --t-tag-bg:#29302B; --t-tag:#C9D1CB; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.02em}

/* Top bar + line tabs */
.top{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 20px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;padding-bottom:10px}
.edit-tools{display:flex;gap:2px;align-self:center;margin-left:8px}
.et-btn{width:32px;height:30px;border:0;border-radius:6px;background:none;color:var(--bar-ink);opacity:.8;cursor:pointer;display:grid;place-items:center}
.et-btn:hover:not(:disabled){opacity:1;background:rgb(255 255 255 / .1)}
.et-btn:disabled{opacity:.3;cursor:default}
.et-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vh-scrim{position:fixed;inset:0;z-index:45;background:rgb(0 0 0 / .25)}
.vh{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line-strong);z-index:46;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgb(0 0 0 / .2)}
.vh-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.vh-h h3{font-size:1.25rem;text-transform:uppercase;letter-spacing:.05em;margin-right:auto}
.vh-list{overflow:auto;flex:1;padding:6px 0}
.vh-day{font:600 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 16px 6px}
.vh-item{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:9px 16px 9px 28px;cursor:pointer;position:relative;font:inherit}
.vh-item::before{content:'';position:absolute;left:13px;top:15px;width:7px;height:7px;border-radius:99px;background:var(--line-strong)}
.vh-item:hover{background:var(--sunken)}
.vh-item.sel{background:var(--accent-soft)}
.vh-item.cur::before{background:var(--accent)}
.vh-item.undone{opacity:.5}
.vh-t{font-weight:600}
.vh-m{font-size:.78rem;color:var(--muted);margin-top:2px}
.vh-tag{font:600 .68rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:6px}
.vh-d{padding:4px 16px 12px 28px;display:grid;gap:8px;font-size:.84rem}
.vh-d ul{margin:0;padding-left:16px;display:grid;gap:3px}
.vh-d .chg{color:var(--muted)}
.vh-d .num{font-variant-numeric:tabular-nums}
.vh-empty{padding:20px 16px;color:var(--muted)}
.brand h1{font-size:1.55rem;text-transform:uppercase;font-weight:700}
.brand span{font:500 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;opacity:.65}
.demo{font:500 .7rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;padding:5px 9px;border-radius:99px;border:1px solid currentColor;color:#E3A94B;margin-bottom:10px}
nav.lines .input-btn{opacity:1;align-self:center;margin:0 0 4px 8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 16px;font:700 .9rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;cursor:pointer}
nav.lines .input-btn:hover{filter:brightness(1.08)}
.sugg-btn{font:500 .7rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;padding:5px 10px;border-radius:99px;border:1px solid currentColor;color:var(--bar-ink);background:none;opacity:.85;cursor:pointer;margin:0 0 10px;display:inline-flex;align-items:center;gap:6px}
.sugg-btn:hover{opacity:1}
.sg-text{width:100%;min-height:84px;resize:vertical;font:inherit}
/* Sign-in screen: same look as the Mix Board's (its colors, fonts and sizes) */
.login{--mb-bg:#f1f3ef;--mb-surface:#fff;--mb-fg:#182019;--mb-muted:#5e6a61;--mb-line:#d3dad2;--mb-line-strong:#aab4ab;--mb-accent:#2c7a44;--mb-accent-ink:#fff;--mb-danger:#b23a3a;--mb-shadow:0 6px 24px rgba(20,30,22,.12);
  position:fixed;inset:0;z-index:60;background:var(--mb-bg);color:var(--mb-fg);display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login{--mb-bg:#141814;--mb-surface:#1d231e;--mb-fg:#e7ece6;--mb-muted:#9ba69c;--mb-line:#2f382f;--mb-line-strong:#4a564b;--mb-accent:#4fb56e;--mb-accent-ink:#0f1a12;--mb-danger:#e06666;--mb-shadow:0 6px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"] .login{--mb-bg:#141814;--mb-surface:#1d231e;--mb-fg:#e7ece6;--mb-muted:#9ba69c;--mb-line:#2f382f;--mb-line-strong:#4a564b;--mb-accent:#4fb56e;--mb-accent-ink:#0f1a12;--mb-danger:#e06666;--mb-shadow:0 6px 24px rgba(0,0,0,.45)}
.login[hidden]{display:none}
.login *{box-sizing:border-box}
.login-card{background:var(--mb-surface);border:1px solid var(--mb-line);border-radius:10px;padding:24px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--mb-shadow)}
.login-card h2{margin:0;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:22px;line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
@media (max-width:440px){.login-card h2{white-space:normal}}
.login .hint{margin:0;font-size:12px;color:var(--mb-muted)}
.login .field{display:flex;flex-direction:column;gap:4px;min-width:0}
.login .field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mb-muted)}
.login .field input{border:1px solid var(--mb-line-strong);border-radius:6px;padding:8px 10px;background:var(--mb-bg);color:var(--mb-fg);font:inherit;width:100%;height:auto}
.login .field input:focus-visible,.login .mb-btn:focus-visible{outline:2px solid var(--mb-accent);outline-offset:2px}
.login .mb-btn{border:1px solid var(--mb-accent);background:var(--mb-accent);color:var(--mb-accent-ink);border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;line-height:1;cursor:pointer}
.login .mb-btn:hover{filter:brightness(1.08)}
.login .mb-btn:disabled{opacity:.6;cursor:default}
.loading-all{padding:40px;text-align:center;color:var(--muted)}
.signout{background:none;border:0;color:inherit;opacity:.8;cursor:pointer;font:inherit;text-decoration:underline;padding:0}
.signout:hover{opacity:1}
.who{font-size:.85rem;opacity:.8;margin-bottom:10px}
nav.lines{display:flex;gap:4px;padding:0 20px;width:100%}
nav.lines button{background:none;border:0;color:inherit;opacity:.6;padding:10px 16px 9px;font:600 1.05rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;border-bottom:3px solid transparent;cursor:pointer}
nav.lines button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent)}

main{padding:20px 20px 60px;margin:0 auto;display:grid;gap:20px}

/* Highlight cards */
.hl-head{display:flex;align-items:center;gap:10px}
.hl-head h2{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:grid;gap:4px;position:relative;min-height:132px}
.card .k{font:500 .72rem/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card .v{font:700 2.3rem/1 var(--f-display);letter-spacing:.01em}
.card .v small{font:500 .85rem var(--f-body);color:var(--muted);margin-left:4px}
.card .s{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.card .up{color:var(--ok)} .card .down{color:var(--bad)}
.hl-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer;border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hsplit{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:4px}
.hs-lab{background:var(--accent)}.hs-eq{background:#C07A3A}
.hs-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.hs-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hs-key b{color:var(--ink);font-weight:600}
.pace{font-weight:600;font-size:.9rem}.pace.up{color:var(--ok)}.pace.down{color:var(--bad)}.pace.flat{color:var(--muted)}
.cards{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@media (max-width:800px){.cards{grid-template-columns:1fr!important}}
.card svg{width:100%;height:30px;display:block;margin-top:2px}
.card .edit{display:grid;gap:6px;margin-top:6px}
.card .x{position:absolute;top:6px;right:6px}
.add-card{border:1.5px dashed var(--line-strong);background:transparent;border-radius:var(--r);min-height:132px;color:var(--muted);cursor:pointer;font-weight:500}
.add-card:hover{border-color:var(--accent);color:var(--accent)}

/* Buttons + inputs */
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 11px;font-size:.88rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line-strong))}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.icon{padding:4px 7px;font-size:.9rem}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-size:.88rem;min-width:0}
input[type=search]{width:180px}

/* Table tabs + toolbar + grid */
.base{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
nav.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:-6px}
nav.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px 9px;font:600 1rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.subtabs button:hover{color:var(--ink)}
nav.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ttabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
.ttabs button{background:none;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.ttabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.toolbar .sp{flex:1}
.toolbar .count{font-size:.82rem;color:var(--muted);margin-right:6px}
.pop{position:relative}
.pop-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:15;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px;min-width:200px;display:grid;gap:4px;box-shadow:0 8px 24px rgb(0 0 0 / .12)}
.pop-menu label{display:flex;gap:8px;align-items:center;font-size:.88rem;padding:3px 4px;border-radius:4px;cursor:pointer}
.pop-menu label:hover{background:var(--sunken)}
.grid-wrap{overflow-x:auto}
.base{min-height:calc(100vh - 210px)}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.88rem}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 10px;height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;text-align:left}
.grid th{position:sticky;top:0;z-index:2;background:var(--sunken);font-weight:600;font-size:.8rem;color:var(--muted);cursor:pointer;user-select:none}
.grid th .ti{font:500 .7rem var(--f-mono);opacity:.7;margin-right:5px}
.grid th.sorted{color:var(--ink)}
.grid td.rn,.grid th.rn{width:46px;min-width:46px;text-align:center;color:var(--faint);font-size:.75rem;position:sticky;left:0;background:inherit;z-index:1}
.grid th.rn{z-index:3;background:var(--sunken)}
.grid tbody tr{background:var(--surface);cursor:pointer}
.grid tbody tr:hover{background:var(--sunken)}
.grid td.r{text-align:right}
.grid tr.void td:not(.rn){color:var(--faint);text-decoration:line-through}
.grid tr.grp td{background:var(--bg);font-weight:600;cursor:default;height:34px}
.grid tr.grp:hover{background:var(--bg)}
.grid tfoot td{position:sticky;bottom:0;background:var(--sunken);font-weight:600;font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;line-height:1.5;margin-right:3px;background:var(--t-tag-bg);color:var(--t-tag)}
.pill.wash{background:var(--t-wash-bg);color:var(--t-wash)} .pill.sock{background:var(--t-sock-bg);color:var(--t-sock)} .pill.bag{background:var(--t-bag-bg);color:var(--t-bag)}
.pill.bin{background:var(--t-wash-bg);color:var(--t-wash)} .pill.totes{background:var(--t-bag-bg);color:var(--t-bag)}
.neg{color:var(--bad)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:min(720px,100%);border:1px solid var(--line-strong)}
.inv{padding:0;display:grid}
.inv-sec{display:grid;gap:12px;padding:18px 18px 20px 20px;border-top:1px solid var(--line);border-left:5px solid var(--acc);background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 6%,transparent),transparent 40%)}
.inv-sec:first-child{border-top:0}
.subtabs{display:flex;gap:4px}
.grid-wrap:has(.bd){max-height:none;overflow:visible}
nav.subtabs .tab-action{margin-left:auto;align-self:center;text-transform:none;letter-spacing:0;font:600 .88rem/1 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 12px;margin-bottom:6px}
nav.subtabs .tab-action:hover{background:var(--sunken)}
.bd-pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bd-pick select,.bd-pick input[type=date]{height:32px}
.bd-wk{min-width:150px;text-align:center;font-size:.88rem}
.bd{display:grid;gap:4px}
.bd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 18px 4px}
.bd-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.bd-card h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;margin:0}
.bd-wide{grid-column:1/-1}
.bd-bars{display:grid;gap:8px}
.bd-row{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto 44px;gap:10px;align-items:center;font-size:.9rem}
.bd-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-track{height:12px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bd-fill{display:block;height:100%;background:var(--s-one);border-radius:99px}
.bd-val{text-align:right;white-space:nowrap;font-weight:600}.bd-val small{font-weight:400;color:var(--muted)}
.bd-pct{text-align:right;color:var(--muted);font-size:.82rem}
.bd-empty{color:var(--muted);font-size:.88rem}
.bd-sub{font:600 1.05rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.bd-chart{width:100%;height:auto;display:block}.bd-chart .gl{stroke:var(--line)}.bd-chart .ax{fill:var(--muted);font:11px var(--f-mono)}
.bd-range{font-size:.88rem}
.eom-tools{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.bd-grid{grid-template-columns:1fr}.bd-row{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}.bd-pct{display:none}}
.eom-wrap{padding:20px;display:flex;justify-content:center;background:var(--bg)}
.eom{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;width:100%;max-width:960px;display:grid;gap:16px}
.eom-wrap{overflow-x:auto}
.eom-h{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.eom-dept{font:500 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.eom-h h3{font-size:1.7rem;text-transform:uppercase;letter-spacing:.04em}
table.eom-t{width:100%;border-collapse:collapse;table-layout:fixed}
.eom-t col.eom-c0{width:120px}

<script>
/* =============================================================
   Dept 14 dashboard.
   Data lives in Supabase (dept14 schema). After sign-in Live.load()
   fills DB and SETTINGS; every save goes back through Live.sync().
   localStorage only keeps per-browser view choices (tabs, ranges).
   ============================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var LIVE_Q=null; // set to Live.queue once the live data layer is ready
const store={get(k,d){try{const v=localStorage.getItem('d14.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){if(k==='db'||k==='settings'){if(LIVE_Q)LIVE_Q();return}try{localStorage.setItem('d14.'+k,JSON.stringify(v))}catch(e){}}};
const fmtN=(n,d=0)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
const fmtDate=s=>{const d=new Date(s+'T12:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})};
const iso=d=>d.toISOString().slice(0,10);
function toast(m){toast.last={m,at:Date.now()};const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}

/* ---------- reference data (matches 001_schema seed) ---------- */

const ORDERS=['AECOM','Port of Vancouver','Tesla','Marin Sanitary','Conagra','John Wayne Airport','KDC-One','Valmont Coating','Griswold'];
const ORCHID_IN=['#1 Medium Green','#1 Small Green','XS Idaho Green','PAC Fibre Large','PAC Fibre Medium','Jumbo Orchid','Cypress Mulch'];
const BINS=['#1 Medium Dried','#2 Medium Dried','Small Dried'];
const SETTINGS=Object.assign({ratio:{wash:.85,sock:.2,bag:.2},bonusPerYardIn:.5,bonusPerTote:.5,bonusYdPerTote:2.5,
  siteUrl:'https://rexiusfleet.github.io/Production/dept14/',
  crew:[{name:'Nathaniel',biochar:true,orchid:false,active:true},{name:'Cameron',biochar:true,orchid:false,active:true},
        {name:'Charlie',biochar:true,orchid:true,active:true},{name:'Joe',biochar:true,orchid:true,active:true},{name:'Isaiah',biochar:true,orchid:true,active:true}],
  forms:{char:{title:'Biochar production sheet',intro:'Submit once per job. List everyone who worked on it.',jobs:['wash','sock','bag'],
               items:['CC1:Basic','CC1:Peat','CC1:Zapt','CC1:Washed','SO1:3','SO1:6','SO1:10','SO1:custom','BAG:Basic','BAG:Peat','BAG:Zapt','BAG:Washed'],questions:['shipping','orders','notes']},
         dryer:{title:'Dryer production sheet',intro:'Submit once per dryer run.',products:ORCHID_IN.slice(),bins:BINS.slice(),questions:['notes']}}
});
const CORE_BLENDS=['Basic','Washed','Peat','Zapt','Revd'],CORE_SOCKS=[3,6,10]; // top three, then the two custom blends; odd mixes are typed in as custom
SETTINGS.orc=Object.assign({yardsPerUnit:7.5,ratios:{'Jumbo Orchid':{small:60,medium:30,lost:10},'#1 Medium Green':{small:75,medium:15,lost:10}}},SETTINGS.orc||{});
/* Picker grates: two % profiles per input product; the active one is what ratios[] (and the database view) use. */
function gratesInit(){const O=SETTINGS.orc;O.profiles=O.profiles||{};O.active=O.active||{};
  Object.keys(O.ratios).forEach(m=>{if(!Array.isArray(O.profiles[m])||O.profiles[m].length<2)O.profiles[m]=[{...O.ratios[m]},{...O.ratios[m]}];if(O.active[m]!==1)O.active[m]=0;O.ratios[m]={...O.profiles[m][O.active[m]]}})}
gratesInit();
SETTINGS.toteSizes=SETTINGS.toteSizes||[{name:'1 yd',yd:1},{name:'2 yd',yd:2,blends:['Washed']}];
SETTINGS.catalog=Object.assign({blends:CORE_BLENDS.slice(),bagTypes:['Basic','Washed','Peat'],sockSizes:CORE_SOCKS.slice(),materials:['Pallets','Blank white totes'],hidden:{}},SETTINGS.catalog||{});
const BLENDS=SETTINGS.catalog.blends,SOCK_SIZES=SETTINGS.catalog.sockSizes,BAG_TYPES=SETTINGS.catalog.bagTypes; // bags have their own list (a subset of the blends that get bagged)
const CORE_BAGS=['Basic','Washed','Peat'];
const crewFor=(line,keep=[])=>[...new Set([...SETTINGS.crew.filter(c=>c.name&&c[line]).map(c=>c.name),...keep])];

/* ---------- demo data generator (deterministic) ---------- */
function seedData(){
  let s=11;const r=()=>(s=(s*9301+49297)%233280)/233280;const pick=a=>a[Math.floor(r()*a.length)];
  const bio=[],orc=[];let id=1;
  for(let d=new Date('2026-05-04T12:00');d<=new Date('2026-11-03T12:00');d.setDate(d.getDate()+1)){
    const wd=d.getDay();if(wd===0||wd===6)continue;
    const n=r()<.22?2:1;
    for(let k=0;k<n;k++){
      const job=r()<.3?'wash':r()<.82?'sock':'bag';
      const crew=r()<.65?['Cameron']:r()<.8?['Nathaniel','Cameron']:['Nathaniel'];
      const run={id:'b'+id++,date:iso(d),job,crew,hours:Math.round(1+r()*7),boxes:0,pallets:0,orders:[],notes:'',status:'active',lines:[]};
      if(job==='wash'){const y=Math.round(5+r()*14);run.lines.push({dir:'in',item:'CB2',qty:y});if(r()<.25)run.lines.push({dir:'in',item:'MAT:Blank white totes',qty:Math.ceil(r()*3)});
        const b=pick(['Basic','Basic','Basic','Peat','Zapt','Washed','Revd']);const out=Math.round(y*(.68+r()*.14));
        if(r()<.35){const a=Math.ceil(out*.6);run.lines.push({dir:'out',item:'CC1:'+b,qty:a},{dir:'out',item:'CC1:Peat',qty:out-a});}
        else run.lines.push({dir:'out',item:'CC1:'+b,qty:out});}
      if(job==='sock'){const b=pick(['Basic','Basic','Basic','Peat']);run.lines.push({dir:'in',item:'CC1:'+b,qty:Math.round(1+r()*3)});
        run.lines.push({dir:'out',item:'SO1:3',qty:Math.round(10+r()*60)});
        if(r()<.5)run.lines.push({dir:'out',item:'SO1:6',qty:Math.round(5+r()*35)});
        if(r()<.2)run.lines.push({dir:'out',item:'SO1:10',qty:Math.round(2+r()*15)});
        if(r()<.06)run.lines.push({dir:'out',item:'SO1:custom',qty:Math.round(2+r()*6),size:pick([4,8,12])});
        run.boxes=Math.round(r()*3);run.pallets=Math.round(1+r()*2);run.orders=r()<.8?[pick(ORDERS)]:[pick(ORDERS),pick(ORDERS)];}
      if(job==='bag'){const b=pick(['Basic','Basic','Peat','Washed']);run.lines.push({dir:'in',item:'CC1:'+b,qty:Math.round(1+r()*2)});
        run.lines.push({dir:'out',item:'BAG:'+b,qty:Math.round(30+r()*40)});run.pallets=1;}
      if(job==='wash'&&r()<.06)run.lines.push({dir:'out',item:'CC1:Basic/Peat mix',qty:2});
      if(r()<.12)run.notes=pick(['Black bins full','Bulk bin','Organized pallets','Remade 6 socks','Short a worker']);
      bio.push(run);
    }
    if(r()<.8){const p=pick(ORCHID_IN);const yin=Math.round((12+r()*16)*2)/2;const yout=Math.round(yin*(.76+r()*.1)*2)/2;const dest=r()<.6?'Totes':'Bin';
      orc.push({id:'o'+id++,date:iso(d),product:p,yardsIn:yin,yardsOut:yout,hours:Math.round((3+r()*4.5)*4)/4,dest,bin:dest==='Bin'?pick(BINS):'',totes:dest==='Totes'?Math.round(yout/2.5*4)/4:0,crew:[pick(['Joe','Isaiah','Charlie'])],notes:'',status:'active'});}
  }
  bio[bio.length-7].status='void';bio[bio.length-7].voidReason='Duplicate submission';
  const adj=[
    {id:'a1',date:'2026-05-01',item:'CB2',qty:240,reason:'opening'},
    ...BLENDS.map((b,i)=>({id:'a2'+i,date:'2026-05-01',item:'CC1:'+b,qty:[160,30,12,8,10][i],reason:'opening'})),
    {id:'a1t',date:'2026-05-01',item:'CB2:tote',qty:14,reason:'opening'},

function itemLabel(code,size){
  const [k,v]=code.split(':');

  if(k==='CC1')return v+' (CC1)';

}

function onHand(){
  const mv=[];
  active(DB.bio).forEach(r=>r.lines.forEach(l=>{const k=l.item==='SO1:custom'?`SO1:custom:${l.size}`:l.item;mv.push([k,r.date,l.dir==='out'?l.qty:-l.qty])}));
  DB.adj.forEach(a=>mv.push([a.item,a.date,a.qty]));
  (DB.purch||[]).forEach(p=>{const m=purchMat(p.material);if(m.line==='biochar')mv.push([m.key,p.date,+p.amount||0])});
  /* completed sales take product out on the day they were completed */
  (DB.orders||[]).filter(o=>o.line==='biochar'&&o.done).forEach(o=>o.lines.forEach(l=>mv.push([l.key,o.doneOn||o.date,-(+l.qty||0)])));
  const C=DB.counts||{},h={};
  mv.forEach(([k,d,q])=>{const c=C[k];if(c&&d<=c.date)return;h[k]=(h[k]||0)+q});
  Object.entries(C).forEach(([k,c])=>{h[k]=(h[k]||0)+c.qty});
  return h;
}

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const dOf=s=>new Date(s+'T12:00');
const daysBetween=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5)+1;
const RANGE_PRESETS={week:'This week',lastweek:'Last week',month:'This month',lastmonth:'Last month',d30:'Last 30 days',custom:'Custom range'};
function topRange(H){
  const t=TODAY,mon=mondayOf(t),first=new Date(t.getFullYear(),t.getMonth(),1);
  const sameDayPrevMonth=d=>{const x=new Date(d.getFullYear(),d.getMonth()-1,1);const end=new Date(d.getFullYear(),d.getMonth(),0).getDate();x.setDate(Math.min(d.getDate(),end));return x};
  switch(H.period){
    case 'week':return {now:[iso(mon),iso(t)],cmp:[iso(addDays(mon,-7)),iso(addDays(t,-7))],cmpLabel:'last week at this point'};
    case 'lastweek':return {now:[iso(addDays(mon,-7)),iso(addDays(mon,-1))],cmp:[iso(addDays(mon,-14)),iso(addDays(mon,-8))],cmpLabel:'the week before'};
    case 'month':return {now:[iso(first),iso(t)],cmp:[iso(new Date(t.getFullYear(),t.getMonth()-1,1)),iso(sameDayPrevMonth(t))],cmpLabel:'last month at this point'};
    case 'lastmonth':{const a=new Date(t.getFullYear(),t.getMonth()-1,1),b=new Date(t.getFullYear(),t.getMonth(),0);return {now:[iso(a),iso(b)],cmp:[iso(new Date(t.getFullYear(),t.getMonth()-2,1)),iso(new Date(t.getFullYear(),t.getMonth()-1,0))],cmpLabel:'the month before'}}
    case 'd30':return {now:[iso(addDays(t,-29)),iso(t)],cmp:[iso(addDays(t,-59)),iso(addDays(t,-30))],cmpLabel:'the 30 days before'};
    default:{let a=H.from||iso(addDays(t,-13)),b=H.to||iso(t);if(a>b)[a,b]=[b,a];const n=daysBetween(a,b);
      return {now:[a,b],cmp:[iso(addDays(dOf(a),-n)),iso(addDays(dOf(a),-1))],cmpLabel:`the ${n} day${n===1?'':'s'} before`}}
  }
}

}

async function loadRunPhotos(id){
  const box=$('#runPhotos');if(!box||!Live.photoRuns||!Live.photoRuns.has(id))return;
  const B=sb.storage.from('dept14-photos');
  const {data:files}=await B.list('runs/'+id,{limit:100,sortBy:{column:'name',order:'asc'}});
  const names=(files||[]).filter(f=>f.name.endsWith('.jpg')).map(f=>'runs/'+id+'/'+f.name);
  if(!$('#runPhotos'))return;
  if(!names.length){box.innerHTML='';return}
  const {data:urls}=await B.createSignedUrls(names,3600);
  if(!$('#runPhotos'))return;
  box.innerHTML=`<div class="sect">Photos</div><div class="run-ph">${(urls||[]).map((u,i)=>`<div class="ph"><a href="${esc(u.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(u.signedUrl)}" alt="Photo ${i+1}"></a><button type="button" class="ph-x" data-rmph="${esc(names[i])}" aria-label="Delete photo ${i+1}">✕</button></div>`).join('')}</div>`;
  box.querySelectorAll('[data-rmph]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this photo?'))return;
    const {error}=await B.remove([b.dataset.rmph]);if(error)return toast('⚠ Couldn’t delete the photo.');
    if(names.length===1)Live.photoRuns.delete(id);loadRunPhotos(id);toast('Photo deleted')});
}

/* ---------- inventory: Raw biochar / Washed / Bags / Socks / Raw materials ----------
   A count simply sets the number. After a count, only production dated after the count
   date moves it. Custom items pop up from the sheets; the manager can remove them or add
   new standard ones (new blends and sock sizes also go onto the crew sheet). */
const INV_SECTIONS=[
  {key:'raw',title:'Raw biochar',code:'14-14-CB2',acc:'raw',fixed:[['CB2','Bulk bin','yd'],['CB2:tote','Toted','totes']]},
  {key:'washed',title:'Washed',code:'14-14-CC1',acc:'wash',unit:'yd',prefix:'CC1:',list:()=>BLENDS,core:CORE_BLENDS,add:'Blend name',addTitle:'Add a blend'},
  {key:'bags',title:'Bags',code:'07-86-15W',acc:'bag',unit:'ea',prefix:'BAG:',list:()=>BAG_TYPES,core:CORE_BAGS,add:'Bag type',addTitle:'Add a bag type'},
  {key:'socks',title:'Socks',code:'14-14-SO1',acc:'sock',unit:'ea',prefix:'SO1:',list:()=>SOCK_SIZES,core:CORE_SOCKS,add:'Size (ft)',addTitle:'Add a sock size',numeric:true},
];
const HIDDEN=()=>SETTINGS.catalog.hidden;
function lastUse(k){let d='';active(DB.bio).forEach(r=>r.lines.forEach(l=>{const key=l.item==='SO1:custom'?`SO1:custom:${l.size}`:l.item;if(key===k&&r.date>d)d=r.date}));return d}
function secItems(sec,h){
  if(sec.fixed)return sec.fixed.map(([key,name,unit])=>({key,name,unit,deletable:false,custom:false}));
  const std=sec.list().map(v=>({key:sec.prefix+v,name:sec.key==='socks'?`${v} ft`:String(v),unit:sec.unit,deletable:!sec.core.includes(v),custom:false,val:v}));
  const stdKeys=new Set(std.map(x=>x.key));
  const isExtra=k=>sec.key==='socks'?k.startsWith('SO1:custom:'):k.startsWith(sec.prefix)&&!stdKeys.has(k);
  const extra=Object.keys(h).filter(k=>isExtra(k)&&(Math.abs(h[k])>1e-9||DB.counts[k]))
    .filter(k=>!HIDDEN()[k]||lastUse(k)>HIDDEN()[k])
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
    .map(k=>({key:k,name:sec.key==='socks'?`${k.split(':')[2]} ft (custom)`:k.slice(sec.prefix.length),unit:sec.unit,deletable:true,custom:true}));
  return [...std,...extra];
}

/* =============================================================
   Orchid bark: Input · Inventory · Sales (Dryer tab = dryer runs)
   Mirrors the "Dept 14 Sales & Inventory" workbook:
   - Input: loader puts material into the picker; units × yards-per-unit = yards,
     split by that material's grate ratio into small / medium green (rest is lost).
     Purchased material goes straight into inventory. Bagging turns dried bin
     yards into pallets of bags.
   - Dryer runs take green out and put dried into a bin or totes.
   - Completed sales take product out.
   ============================================================= */
const ORC_PICK=['Jumbo Orchid','#1 Medium Green'];
const ORC_PURCHASED=['XS Idaho Green','PAC Fibre Large','PAC Fibre Medium','Cypress Mulch','#1 Small Green','#1 Medium Green','Jumbo Orchid','NW Bark'];
const ORC_SECTIONS=[
  {key:'ogreen',title:'Green',code:'',acc:'wash',unit:'yd',fixed:['#1 Medium Green','#1 Small Green','XS Idaho Green','PAC Fibre Large','PAC Fibre Medium','Cypress Mulch'].map(n=>['O:'+n,n,'yd'])},
  {key:'odried',title:'Dried bins',code:'',acc:'bag',unit:'yd',fixed:['#1 Medium Dried','#2 Medium Dried','Small Dried'].map(n=>['O:'+n,n,'yd'])},
  {key:'ototes',title:'Totes',code:'',acc:'sock',unit:'totes',fixed:[['O:Medium totes','Medium totes','totes'],['O:Small totes','Small totes','totes']]},
  {key:'obag',title:'Bagged',code:'',acc:'raw',unit:'pallets',fixed:[['O:Medium bagged','Medium bagged','pallets'],['O:Small bagged','Small bagged','pallets']]},
];
const ORC_SALE_PRODUCTS=ORC_SECTIONS.flatMap(s=>s.fixed.map(f=>f[1]));
const orcSaleProducts=()=>[...new Set([...ORC_SALE_PRODUCTS,...extraBins().map(b=>b.name)])];
const orcUnit=name=>{const x=extraBins().find(b=>b.name===name);if(x)return x.kind==='bagged'?'pallets':x.kind==='totes'?'totes':'yd';return (ORC_SECTIONS.flatMap(s=>s.fixed).find(f=>f[1]===name)||[,,'yd'])[2]};
const smallish=p=>/small|xs|pac fibre medium/i.test(p);
function inputCalc(e){
  const O=SETTINGS.orc;
  if(e.type==='pick'){const yards=(+e.units||0)*O.yardsPerUnit,r=e.pct||O.ratios[e.material]||{small:0,medium:0,lost:100};
    return {yards,small:yards*r.small/100,medium:yards*r.medium/100,lost:yards*r.lost/100}}
  return {yards:+e.yards||0,small:0,medium:0,lost:0};
}
function onHandOrc(){
  const mv=[],add=(k,d,q)=>mv.push(['O:'+k,d,q]);
  DB.oin.forEach(e=>{const c=inputCalc(e);
    if(e.type==='pick'){add('#1 Small Green',e.date,c.small);add('#1 Medium Green',e.date,c.medium);if(e.material==='#1 Medium Green'||e.material==='Jumbo Orchid')add(e.material,e.date,-c.yards)}
    else if(e.type==='bag'){add(e.material,e.date,-c.yards);add(e.material==='Small Dried'?'Small bagged':'Medium bagged',e.date,+e.pallets||0)}});
  (DB.purch||[]).forEach(p=>{const m=purchMat(p.material);if(m.line==='orchid')add(p.material,p.date,+p.amount||0)});
  active(DB.orc).forEach(r=>{add(r.product,r.date,-r.yardsIn);
    if(r.dest==='Bin'&&r.bin)add(r.bin,r.date,r.yardsOut);else if(r.dest==='Totes')add(smallish(r.product)?'Small totes':'Medium totes',r.date,r.totes||0)});
  (DB.orders||[]).filter(o=>o.line==='orchid'&&o.done).forEach(o=>o.lines.forEach(l=>add(l.key.slice(2),o.doneOn||o.date,-(+l.qty||0))));
  DB.adj.filter(a=>a.item.startsWith('O:')).forEach(a=>mv.push([a.item,a.date,a.qty]));
  const C=DB.counts,h={};
  mv.forEach(([k,d,q])=>{const c=C[k];if(c&&d<=c.date)return;h[k]=(h[k]||0)+q});
  Object.entries(C).forEach(([k,c])=>{if(k.startsWith('O:'))h[k]=(h[k]||0)+c.qty});
  return h;
}
ORC_SECTIONS.forEach(s=>s.hand=onHandOrc);

/* Bin map: laid out like the workbook's Inventory tab. One column per bin, green (dark green
   header) then dried (orange header), with the black divider where the sheet has its blacked-out
   column. Each bin shows its on-hand number and the note under it (what it turns into). There are no
   breakdown rows: the math lives in the database, not in sheet-style formulas.
   Bagged pallets sit below, like the "Bag InputInventory" tab, with totes beside them. */
const BIN_CORE=[
  {name:'#1 Medium Green',kind:'green',note:'Turns into #1 Medium Dried'},

  {name:'XS Idaho Green',kind:'green',note:'Purchased'},

/* Bins the manager adds (Inventory → + Add bin). Stored in SETTINGS.orc.extraBins.
   New green bins go after the last green bin, new dried bins at the end. Only added bins can be deleted;
   the workbook's bins are fixed. Past production and sales rows keep the name of a deleted bin. */
const extraBins=()=>SETTINGS.orc.extraBins||(SETTINGS.orc.extraBins=[]);
function binMap(){
  const ex=extraBins().map(b=>({...b,added:true}));
  const firstDried=BIN_CORE.findIndex(c=>c.kind==='dried');

  const core=k=>BIN_CORE.filter(c=>c.kind===k);
  return [...core('green'),...ex.filter(b=>b.kind==='green'),...core('dried'),...ex.filter(b=>b.kind==='dried'),...core('material')]
    .map(c=>c.divider||N[c.name]===undefined?c:{...c,note:N[c.name]});
}
/* bin notes are typed straight into the bin map, like a spreadsheet cell */

    const jr=rs.filter(r=>r.job===g.job);const hrs=jr.reduce((a,r)=>a+r.hours,0);const eq=hrs*SETTINGS.ratio[g.job];
    const by={};jr.forEach(r=>r.lines.filter(l=>l.dir==='out'&&g.match(l)).forEach(l=>{const n=itemLabel(l.item,l.size);by[n]=(by[n]||0)+l.qty}));

    const sum=(dir,pred)=>jr.reduce((a,r)=>a+linesSum(r,dir,pred),0);return {labor:hrs-eq,equip:eq,sum}};

   Biochar Reports: a dashboard. The Hours · Product in · Product out

const BD_UNIT={wash:'yd',sock:'socks',bag:'bags'};
function bdLabel(l,dir,job){
  const [k,v]=l.item.split(':');
  if(k==='SO1')return v==='custom'?`${fmtN(l.size,2)} ft (custom)`:`${v} ft`;
  if(k==='CB2')return v==='tote'?'Raw char · toted':'Raw char · bulk bin';
  if(k==='MAT')return v;
  return v;
}
function bdUnit(l){const [k,v]=l.item.split(':');if(k==='CB2')return v==='tote'?'totes':'yd';if(k==='MAT')return 'totes';if(k==='CC1')return 'yd';if(k==='SO1')return 'socks';if(k==='BAG')return 'bags';return ''}
function bdGroup(rs,dir,job){
  const m=new Map();
  rs.forEach(r=>r.lines.filter(l=>l.dir===dir&&+l.qty>0).forEach(l=>{const lab=bdLabel(l,dir,job),u=bdUnit(l),k=lab+'|'+u;const o=m.get(k)||{label:lab,unit:u,qty:0,runs:new Set()};o.qty+=+l.qty;o.runs.add(r.id);m.set(k,o)}));
  return [...m.values()].sort((a,b)=>b.qty-a.qty);
}
function bdBars(list){
  if(!list.length)return '<div class="bd-empty">None in this range.</div>';
  const byUnit={};list.forEach(x=>byUnit[x.unit]=(byUnit[x.unit]||0)+x.qty);
  const max=Math.max(...list.map(x=>x.qty));
  return `<div class="bd-bars">${list.map(x=>`<div class="bd-row"><span class="bd-lab">${esc(x.label)}</span>
    <span class="bd-track"><span class="bd-fill" style="width:${Math.max(1.5,x.qty/max*100)}%"></span></span>
    <span class="bd-val num">${fmtN(x.qty,1)} <small>${x.unit}</small></span><span class="bd-pct num">${byUnit[x.unit]?Math.round(x.qty/byUnit[x.unit]*100):0}%</span></div>`).join('')}</div>`;
}
/* Product made per week. Week mode: the 12 weeks ending with the chosen week (that week is highlighted).
   Custom range: every week the range touches. */
function bdTrend(job,from,to,hiWeek){
  const out=r=>r.lines.filter(l=>l.dir==='out').reduce((a,l)=>a+(+l.qty||0),0);
  const weeks=[];for(let x=mondayOf(dOf(from));x<=dOf(to);x.setDate(x.getDate()+7))weeks.push(iso(x));
  const lo=weeks[0],hi=iso(addDays(dOf(weeks[weeks.length-1]),6));
  const v=Object.fromEntries(weeks.map(k=>[k,0]));
  active(DB.bio).filter(r=>r.job===job&&r.date>=lo&&r.date<=hi&&r.date>=from&&r.date<=to).forEach(r=>{const k=iso(mondayOf(dOf(r.date)));if(k in v)v[k]+=out(r)});
  const vals=weeks.map(k=>v[k]),max=niceMax(Math.max(...vals,0)||1),W=900,H=200,pl=44,pb=26,pt=8,pr=6,iw=W-pl-pr,ih=H-pt-pb,n=weeks.length,bw=iw/n,barW=Math.max(3,Math.min(44,bw*.62));
  const y=q=>pt+ih-(q/max)*ih,every=Math.ceil(n/13);
  const lab=k=>dOf(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  let bars='';weeks.forEach((k,i)=>{const h=Math.max(0,y(0)-y(vals[i])),x=pl+i*bw+(bw-barW)/2;
    if(h>0)bars+=`<path d="${roundTop(x,y(0)-h,barW,h,Math.min(4,h))}" fill="var(--s-one)" opacity="${hiWeek&&k!==hiWeek?.45:1}"><title>Week of ${lab(k)}: ${fmtN(vals[i],1)} ${BD_UNIT[job]}</title></path>`;
    if(i%every===0||k===hiWeek)bars+=`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" class="ax">${lab(k)}</text>`});
  return `<div class="bd-sub">${job==='wash'?'Washed char':job==='sock'?'Socks':'Bags'} made by week</div>
    <svg class="bd-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Made by week">${[0,.5,1].map(f=>max*f).map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" class="ax">${fmtN(t,Number.isInteger(t)?0:1)}</text>`).join('')}${bars}</svg>`;
}

  if(B.mode==='custom'){if(!B.from){B.from=iso(addDays(TODAY,-27));B.to=iso(TODAY)}if(B.from>B.to)[B.from,B.to]=[B.to,B.from];return {B,from:B.from,to:B.to}}

function splitKeys(kind){

const splitLabel=(kind,k)=>kind==='size'?(k==='custom'?'Custom':`${k} ft`):kind==='job'?cap(k):kind==='oproduct'&&k==='Other'?'Other (Jumbo, Cypress, added bins)':k;
function bucketOf(date,by){if(by==='month')return date.slice(0,7);const d=new Date(date+'T12:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return iso(d)}
function bucketLabel(b,by,short){if(by==='month')return new Date(b+'-15T12:00').toLocaleDateString('en-US',short?{month:'short'}:{month:'long',year:'numeric'});return (short?'':'Week of ')+new Date(b+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function buckets(by,months){
  const out=[];const end=new Date(TODAY);const start=new Date(TODAY.getFullYear(),TODAY.getMonth()-months+1,1);
  if(by==='month'){for(let d=new Date(start);d<=end;d.setMonth(d.getMonth()+1))out.push(iso(d).slice(0,7))}
  else{let d=new Date(bucketOf(iso(start),'week')+'T12:00');while(d<=end){out.push(iso(d));d.setDate(d.getDate()+7)}}
  return out;
}
function trendSeries(){
  const T=trendState(),MS=trendMeasures();
  const M=MS[T.m],bs=buckets(T.by,T.range);
  const rs=M.rows?M.rows():active(DB.bio).filter(r=>!M.job||r.job===M.job);
  const kind=T.split&&M.split?M.split:null;
  const keys=kind?splitKeys(kind):['total'];
  const grid=bs.map(b=>{const inB=rs.filter(r=>bucketOf(r.date,T.by)===b);
    if(M.ratio)return {b,v:{total:M.ratio(inB)}};
    const v={};keys.forEach(k=>{
      if(k==='total')v[k]=inB.reduce((a,r)=>a+M.val(r),0);
      else if(k==='Other'){const named=keys.filter(x=>x!=='Other');v[k]=inB.reduce((a,r)=>a+M.val(r)-named.reduce((x,nm)=>x+M.val(r,nm),0),0)}
      else v[k]=inB.reduce((a,r)=>a+M.val(r,k),0)});
    return {b,v}});

/* =============================================================
   Undo / redo / version history (like Google Sheets).
   Every save of the data (DB) or Settings becomes a version: the
   collections that changed, before and after. Undo steps back one
   version, Redo steps forward, and Version history lists every version
   with who, when and exactly what changed; "Restore this version" puts
   everything back the way it was then, as a new version (so it can be
   undone too). A new edit after an undo drops the redo steps.
   Shortcuts: ⌘Z / Ctrl+Z undo · ⌘⇧Z / Ctrl+Shift+Z / Ctrl+Y redo ·
   ⌘⌥⇧H / Ctrl+Alt+Shift+H version history. Inside a text box the
   browser's own text undo runs instead.
   Prototype: kept in this browser (d14.versions, last 80). Live: a
   dept14 audit table written by the database, shared by every manager.
   ============================================================= */
const VH_NAMES={bio:'Biochar production sheets',orc:'Dryer runs',oin:'Picker & bagging production',purch:'Purchased material',orders:'Sales',counts:'Inventory counts',adj:'Inventory adjustments',cal:'Calendar notes',settings:'Settings'};
const VH_MAX=80;
const VH={list:[],ptr:-1,applying:false,pending:false};
(function vhLoad(){try{const v=JSON.parse(localStorage.getItem('d14.versions')||'null');if(v&&Array.isArray(v.list)){VH.list=v.list;VH.ptr=Math.min(v.ptr,v.list.length-1)}}catch(e){}})();
const vhState=()=>{const o={};Object.keys(DB).forEach(k=>o[k]=JSON.stringify(DB[k]));o.settings=JSON.stringify(SETTINGS);return o};
let VH_CUR=vhState();
function vhPersist(){
  let tries=0;while(tries++<4){try{localStorage.setItem('d14.versions',JSON.stringify({list:VH.list,ptr:VH.ptr}));return}catch(e){const n=Math.ceil(VH.list.length/2);VH.list.splice(0,n);VH.ptr=Math.max(-1,VH.ptr-n)}}
}
function vhCommit(){
  VH.pending=false;if(VH.applying)return;
  const now=vhState(),changes={};
  new Set([...Object.keys(now),...Object.keys(VH_CUR)]).forEach(k=>{if(now[k]!==VH_CUR[k])changes[k]={b:VH_CUR[k]??null,a:now[k]??null}});
  if(!Object.keys(changes).length)return;
  const t=VH.label||'';VH.label='';
  VH.list.splice(VH.ptr+1);   // a new edit drops anything that was undone
  VH.list.push({id:'v'+Date.now(),at:new Date().toISOString(),by:ME,label:t,changes});VH.list[VH.list.length-1].title=vhSummary(VH.list[VH.list.length-1]);
  if(VH.list.length>VH_MAX)VH.list.splice(0,VH.list.length-VH_MAX);
  VH.ptr=VH.list.length-1;VH_CUR=now;vhPersist();vhButtons();if(vhOpen())renderVH();
}
/* every write of the data or Settings schedules one version; all saves from one click land in the same version */
const _storeSet=store.set.bind(store);
store.set=(k,v)=>{_storeSet(k,v);if((k==='db'||k==='settings')&&!VH.applying&&!VH.pending){VH.pending=true;setTimeout(vhCommit,0)}};
function vhApply(side,v){   // side 'b' = undo this version, 'a' = redo it
  VH.applying=true;
  Object.entries(v.changes).forEach(([k,c])=>{const val=c[side];
    if(k==='settings'){const o=JSON.parse(val);Object.keys(SETTINGS).forEach(x=>delete SETTINGS[x]);Object.assign(SETTINGS,o)}
    else if(val==null)delete DB[k];else DB[k]=JSON.parse(val)});
  _storeSet('db',DB);_storeSet('settings',SETTINGS);
  VH_CUR=vhState();VH.applying=false;
}
function vhAfter(msg){closeModal();vhPersist();vhButtons();render();if(vhOpen())renderVH();toast(msg)}
function undo(){if(VH.ptr<0)return toast('Nothing to undo');const v=VH.list[VH.ptr];vhApply('b',v);VH.ptr--;vhAfter('Undid: '+vhTitle(v))}
function redo(){if(VH.ptr>=VH.list.length-1)return toast('Nothing to redo');const v=VH.list[VH.ptr+1];vhApply('a',v);VH.ptr++;vhAfter('Redid: '+vhTitle(v))}
/* restore: put every collection back to how it was right after version i (or before the first one) */
function vhRestore(i){
  const target={...VH_CUR};
  for(let j=VH.ptr;j>i;j--)Object.entries(VH.list[j].changes).forEach(([k,c])=>target[k]=c.b);
  for(let j=VH.ptr+1;j<=i;j++)Object.entries(VH.list[j].changes).forEach(([k,c])=>target[k]=c.a);
  const when=i<0?'the oldest saved version':vhTime(VH.list[i].at);
  VH.applying=true;
  Object.entries(target).forEach(([k,val])=>{if(k==='settings'){const o=JSON.parse(val);Object.keys(SETTINGS).forEach(x=>delete SETTINGS[x]);Object.assign(SETTINGS,o)}else if(val==null)delete DB[k];else DB[k]=JSON.parse(val)});
  _storeSet('db',DB);_storeSet('settings',SETTINGS);VH.applying=false;
  VH.label=`Restored the version from ${when}`;vhCommit();
  closeModal();render();toast(`Restored the version from ${when}`);
}
const vhTime=iso=>new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
/* what changed, row by row */
function vhRowName(k,r){
  if(!r||typeof r!=='object')return '';
  const d=r.date?fmtDate(r.date):'';
  if(k==='bio')return `${cap(r.job||'')} sheet · ${d}`;
  if(k==='orc')return `Dryer run · ${d} · ${r.product||''}`;
  if(k==='oin')return `${IN_TYPES[r.type]||'Input'} · ${d} · ${r.material||''}`;
  if(k==='purch')return `${r.material||''} · ${d}${r.po?' · PO '+r.po:''}`;
  if(k==='orders')return `${r.customer||'Order'} · ${d}${r.so?' · '+r.so:''}`;
  if(k==='adj')return `${(r.item||'').replace(/^O:/,'')} · ${d}`;
  if(k==='cal')return `${{bio:'Production',dryer:'Dryer',pick:'Picker',bag:'Bagging',orc:'Plan ·'}[r.kind]||''} calendar · ${r.day?fmtDate(r.day):''}${r.off?' · off':''}`;
  return r.name||r.id||'';
}
const VH_FIELD={yardsIn:'yards in',yardsOut:'yards out',dest:'went to',voidReason:'void reason',so:'sales order #',done:'completed',per:'per'};
const vhVal=v=>v==null||v===''?'—':typeof v==='boolean'?(v?'yes':'no'):typeof v==='object'?'(edited)':String(v);
function vhDiff(k,c){
  const B=c.b==null?null:JSON.parse(c.b),A=c.a==null?null:JSON.parse(c.a),out=[];
  if(Array.isArray(B)||Array.isArray(A)){
    const bm=new Map((B||[]).map(r=>[r.id,r])),am=new Map((A||[]).map(r=>[r.id,r]));
    am.forEach((r,id)=>{if(!bm.has(id))out.push(`Added ${vhRowName(k,r)}`)});
    bm.forEach((r,id)=>{if(!am.has(id))out.push(`Deleted ${vhRowName(k,r)}`)});
    am.forEach((r,id)=>{const o=bm.get(id);if(!o||JSON.stringify(o)===JSON.stringify(r))return;
      const f=Object.keys({...o,...r}).filter(x=>JSON.stringify(o[x])!==JSON.stringify(r[x])&&x!=='id');
      out.push(`${vhRowName(k,r)}: ${f.slice(0,4).map(x=>`${VH_FIELD[x]||x} <span class="num">${esc(vhVal(o[x]))} → ${esc(vhVal(r[x]))}</span>`).join(', ')}${f.length>4?'…':''}`)});
  }else{
    const bo=B||{},ao=A||{},flat=(o,p='')=>Object.entries(o).flatMap(([x,v])=>v&&typeof v==='object'&&!Array.isArray(v)?flat(v,p+x+' › '):[[p+x,v]]);
    const bf=new Map(flat(bo)),af=new Map(flat(ao));
    new Set([...bf.keys(),...af.keys()]).forEach(x=>{const o=bf.get(x),n=af.get(x);if(JSON.stringify(o)===JSON.stringify(n))return;
      const nm=k==='counts'?x.replace(/^O:/,'').replace(/ › qty$/,'').replace(/^(\w+):/,'$1 '):x;
      if(k==='counts'&&/ › date$/.test(x))return;
      out.push(`${esc(nm)} <span class="num">${esc(vhVal(o))} → ${esc(vhVal(n))}</span>`)});
  }
  return out;
}
/* A short title for a version, written from what changed. */
const VH_SET={bonusPerYardIn:'bonus $ per yard',bonusPerTote:'bonus $ per tote',bonusYdPerTote:'yards per tote',ratio:'equipment hours',crew:'crew',orc:'orchid settings',catalog:'inventory items',siteUrl:'site link',forms:'crew sheets',reports:'saved reports'};
const VH_ONE={bio:'production sheet',orc:'dryer run',oin:'input',purch:'purchase',orders:'sales order',adj:'inventory adjustment'};
function vhSummary(v){
  if(v.label)return v.label;
  const parts=Object.entries(v.changes).filter(([k])=>VH_NAMES[k]).map(([k,c])=>{
    const B=c.b==null?null:JSON.parse(c.b),A=c.a==null?null:JSON.parse(c.a);
    if(k==='settings'){const keys=Object.keys({...B,...A}).filter(x=>JSON.stringify((B||{})[x])!==JSON.stringify((A||{})[x]));return 'Settings: '+(keys.map(x=>VH_SET[x]||x).join(', ')||'changed')}
    if(k==='counts'){const keys=Object.keys({...B,...A}).filter(x=>JSON.stringify((B||{})[x])!==JSON.stringify((A||{})[x])).map(x=>x.replace(/^O:/,'').replace(/^(CC1|SO1|BAG):/,'').replace(/^CB2$/,'Raw bulk bin'));
      return keys.length===1?`Count changed · ${keys[0]}`:`${keys.length} counts changed`}
    const bm=new Map((B||[]).map(r=>[r.id,r])),am=new Map((A||[]).map(r=>[r.id,r]));
    const added=[...am.keys()].filter(id=>!bm.has(id)),gone=[...bm.keys()].filter(id=>!am.has(id)),edited=[...am.keys()].filter(id=>bm.has(id)&&JSON.stringify(bm.get(id))!==JSON.stringify(am.get(id)));
    const n=added.length+gone.length+edited.length;
    if(n===1){const id=added[0]||gone[0]||edited[0],r=am.get(id)||bm.get(id);
      let verb=added.length?'Added':gone.length?'Deleted':'Edited';
      if(edited.length){const o=bm.get(id);if(k==='orders'&&o.done!==r.done&&Object.keys(r).every(x=>x==='done'||x==='doneOn'||JSON.stringify(o[x])===JSON.stringify(r[x])))verb=r.done?'Completed':'Reopened';
        else if(o.status!==r.status)verb=r.status==='void'?'Voided':'Restored'}
      return `${verb} · ${k==='orders'?'Sales order · ':k==='adj'?'Adjustment · ':k==='purch'?'Purchase · ':''}${vhRowName(k,r)}`}
    return `${VH_NAMES[k]}: ${[added.length&&added.length+' added',edited.length&&edited.length+' edited',gone.length&&gone.length+' deleted'].filter(Boolean).join(', ')}`;
  });
  return parts.join(' · ')||'Changed';
}

/* =============================================================

   On sign-in, Live.load() reads every table and fills DB and

   save (saveDB / store.set('settings')) runs Live.sync(), which

/* ---- biochar item ↔ the dashboard's item keys (CB2, CB2:tote, CC1:Basic, BAG:Peat, SO1:3, SO1:custom, MAT:Blank white totes) ---- */
function keyOfLine(it,custom_name){
  if(!it)return 'MAT:Unknown';
  if(it.kind==='raw')return it.unit==='totes'?'CB2:tote':'CB2';
  if(it.kind==='other')return 'MAT:'+it.name;
  if(it.kind==='blend')return 'CC1:'+(it.is_custom?custom_name:it.blend);
  if(it.kind==='bag')return 'BAG:'+(it.is_custom?custom_name:it.blend);
  if(it.kind==='sock')return it.is_custom?'SO1:custom':'SO1:'+sizeOf(it);
  return 'MAT:'+it.name;
}
function itemOfKey(key,size){
  const [k,v,extra]=key.split(':');const I=Live.items;
  const pick=(kind,blend)=>I.find(i=>i.kind===kind&&!i.is_custom&&i.blend===blend);
  const custom=kind=>I.find(i=>i.kind===kind&&i.is_custom);
  if(k==='CB2')return {item_id:(I.find(i=>i.kind==='raw'&&i.unit===(v==='tote'?'totes':'yd'))||{}).id};
  if(k==='MAT')return {item_id:(I.find(i=>i.kind==='other'&&i.name===v)||{}).id};
  if(k==='CC1'||k==='BAG'){const kind=k==='CC1'?'blend':'bag';const it=pick(kind,v);return it?{item_id:it.id}:{item_id:(custom(kind)||{}).id,custom_name:v}}
  if(k==='SO1'){if(v==='custom')return {item_id:(custom('sock')||{}).id,custom_size_ft:+(extra||size)||null};
    const it=I.find(i=>i.kind==='sock'&&!i.is_custom&&sizeOf(i)===+v);return it?{item_id:it.id}:{item_id:(custom('sock')||{}).id,custom_size_ft:+v}}
  return {item_id:null};
}
const countKeyOf=(it,size,name)=>{const k=keyOfLine(it,name);return k==='SO1:custom'?`SO1:custom:${+size}`:k};

async function fetchAll(table,select='*',filter){

    const {data,error}=await q;if(error)throw error;out.push(...data);if(data.length<1000)break}
  return out;
}

    pendingTotes:(r.pending_totes||[]).map(p=>({key:keyOfLine(Live.item(p.item_id),p.custom_name),count:+p.count})),
    boxes:r.boxes??0,pallets:r.pallets??0,orders:r.order_refs||[],notes:r.notes||'',status:r.status,voidReason:r.void_reason||'',source:r.source}));
  DB.orc=dryer.map(r=>({id:r.id,date:r.production_date,product:bn(r.product_bin_id),yardsIn:+r.yards_in,yardsOut:+r.yards_out,hours:+r.hours,
    dest:r.destination==='bin'?'Bin':'Totes',bin:r.bin_id?bn(r.bin_id):'',totes:r.totes!=null?+r.totes:0,crew:(r.dryer_run_workers||[]).map(w=>Live.empName(w.employee_id)).filter(Boolean),
    notes:r.notes||'',status:r.status,voidReason:r.void_reason||'',source:r.source}));
  Live.hasGrates=picker.length?'small_pct' in picker[0]:!(await sb.from('picker_runs').select('small_pct').limit(1)).error;
  DB.oin=[...picker.map(p=>({id:p.id,type:'pick',date:p.production_date,material:bn(p.material_bin_id),units:+p.units,hours:+p.hours,yards:0,pallets:0,notes:p.notes||'',
    ...(p.small_pct!=null?{grate:p.grate_profile||1,pct:{small:+p.small_pct,medium:+p.medium_pct,lost:+p.lost_pct}}:{})})),
          ...bagging.map(b=>({id:b.id,type:'bag',date:b.production_date,material:bn(b.from_bin_id),yards:+b.yards_used,pallets:+b.pallets,hours:+b.hours,units:0,notes:b.notes||''}))];
  Live.hasPrio=!orders.length||'priority' in orders[0];
  if(!orders.length)Live.hasPrio=!(await sb.from('orders').select('priority').limit(1)).error;
  Live.hasShip=orders.length?'ready' in orders[0]:!(await sb.from('orders').select('ready').limit(1)).error;
  DB.orders=orders.map(o=>({id:o.id,line:o.line,date:o.order_date,customer:o.customer,so:o.sales_order_no||'',notes:o.notes||'',done:o.completed,doneOn:o.completed_on||null,priority:o.priority??null,
    po:o.po||'',ready:!!o.ready,readyOn:o.ready_on||null,carrier:o.carrier||'',shipDate:o.ship_date||null,freight:o.freight_cost!=null?+o.freight_cost:null,
    lines:(o.order_lines||[]).map(l=>({key:l.bin_id?'O:'+bn(l.bin_id):countKeyOf(Live.item(l.item_id),l.custom_size_ft,l.custom_name),qty:+l.qty,...(l.load_type?{load:l.load_type}:{})}))}));
  DB.purch=purch.map(p=>({id:p.id,date:p.purchase_date,material:p.bin_id?bn(p.bin_id):PURCH_RAW[keyOfLine(Live.item(p.item_id))]||'',amount:+p.amount,po:p.po||'',notes:p.notes||''}));
  try{DB.cal=(await fetchAll('calendar_days')).map(c=>({id:c.id,kind:c.kind,day:c.day,note:c.note||'',off:!!c.off}));Live.hasCal=true}catch(e){DB.cal=[];Live.hasCal=false}
  DB.adj=adj.map(a=>({id:a.id,date:a.adj_date,item:a.bin_id?'O:'+bn(a.bin_id):countKeyOf(Live.item(a.item_id),a.custom_size_ft,a.custom_name),qty:+a.qty_delta,reason:a.reason,notes:a.notes||''}));
  DB.counts={};
  counts.forEach(c=>{const k=c.bin_id?'O:'+bn(c.bin_id):countKeyOf(Live.item(c.item_id),c.custom_size_ft,c.custom_name);if(!DB.counts[k])DB.counts[k]={qty:+c.qty,date:c.counted_on}});
  /* settings */
  const S=Object.fromEntries(settings.map(r=>[r.key,r.value]));
  if(S.equipment_ratio)SETTINGS.ratio={wash:+S.equipment_ratio.wash,sock:+S.equipment_ratio.sock,bag:+S.equipment_ratio.bag};
  if(S.bonus){SETTINGS.bonusPerYardIn=+S.bonus.per_yard_in;SETTINGS.bonusPerTote=+S.bonus.per_tote;SETTINGS.bonusYdPerTote=+S.bonus.yards_per_tote}
  if(S.orchid){SETTINGS.orc={...SETTINGS.orc,yardsPerUnit:+S.orchid.yards_per_unit,ratios:S.orchid.ratios,profiles:S.orchid.profiles,active:S.orchid.active,extraBins:[]};gratesInit()}
  if(Array.isArray(S.tote_sizes))SETTINGS.toteSizes=S.tote_sizes;
  Live.photoRuns=new Set();
  try{for(let off=0;;off+=1000){const {data,error}=await sb.storage.from('dept14-photos').list('runs',{limit:1000,offset:off});if(error||!data)break;data.forEach(f=>Live.photoRuns.add(f.name));if(data.length<1000)break}}catch(e){}
  if(S.dashboard){const D=S.dashboard;if(D.siteUrl)SETTINGS.siteUrl=D.siteUrl;if(D.forms)SETTINGS.forms=D.forms;if(D.hidden)SETTINGS.catalog.hidden=D.hidden}
  SETTINGS.crew=emp.filter(e=>e.active).map(e=>({id:e.id,name:e.name,biochar:e.on_biochar_sheet,orchid:e.on_dryer_sheet,active:true}));
  const blends=items.filter(i=>i.kind==='blend'&&!i.is_custom&&i.active).sort((a,b)=>a.sort-b.sort).map(i=>i.blend);
  BLENDS.splice(0,BLENDS.length,...blends);
  const bags=items.filter(i=>i.kind==='bag'&&!i.is_custom&&i.active).sort((a,b)=>a.sort-b.sort).map(i=>i.blend);
  BAG_TYPES.splice(0,BAG_TYPES.length,...bags);
  const socks=items.filter(i=>i.kind==='sock'&&!i.is_custom&&i.active).map(sizeOf).sort((a,b)=>a-b);
  SOCK_SIZES.splice(0,SOCK_SIZES.length,...socks);
  SETTINGS.orc.extraBins=bins.filter(b=>!b.is_core&&b.active&&['green','dried','bagged','totes'].includes(b.kind)).map(b=>({name:b.name,kind:b.kind,note:b.note||''}));
  SETTINGS.orc.binNotes=Object.fromEntries(bins.map(b=>[b.name,b.note||'']));
  SETTINGS.reports=reports.map(r=>({id:r.id,line:r.line,name:r.name,cfg:r.config}));
  SETTINGS.ratio.other=0;
  Live.base=Live.snap();Live.sbase=Live.ssnap();Live.loadedAt=Date.now();
};
/* first sign-in: add the starter reports */
Live.seedReports=async function(){
  if(SETTINGS.reports.length)return;
  const rows=RB_STARTERS.map(r=>({id:newId(),line:r.line,name:r.name,config:r.cfg}));
  const {error}=await sb.from('saved_reports').insert(rows);if(error)throw error;
  SETTINGS.reports=rows.map(r=>({id:r.id,line:r.line,name:r.name,cfg:r.config}));Live.sbase=Live.ssnap();
};

/* ---- snapshots used to work out what changed ---- */
const COLS=['bio','orc','oin','orders','purch','adj','cal'];
Live.snap=()=>{const o={};COLS.forEach(c=>{o[c]=new Map((DB[c]||[]).map(r=>[r.id,JSON.stringify(r)]))});o.counts=JSON.stringify(DB.counts||{});return o};
Live.ssnap=()=>JSON.stringify({ratio:{wash:SETTINGS.ratio.wash,sock:SETTINGS.ratio.sock,bag:SETTINGS.ratio.bag},bonus:[SETTINGS.bonusPerYardIn,SETTINGS.bonusPerTote,SETTINGS.bonusYdPerTote],
  orc:{y:SETTINGS.orc.yardsPerUnit,r:SETTINGS.orc.ratios,p:SETTINGS.orc.profiles,a:SETTINGS.orc.active},binNotes:SETTINGS.orc.binNotes||{},crew:SETTINGS.crew,blends:[...BLENDS],bags:[...BAG_TYPES],socks:[...SOCK_SIZES],bins:SETTINGS.orc.extraBins||[],reports:SETTINGS.reports||[],
  dash:{siteUrl:SETTINGS.siteUrl,forms:SETTINGS.forms,hidden:SETTINGS.catalog.hidden},totes:SETTINGS.toteSizes});

/* ---- dashboard record → table row ---- */
const ROW={
  cal:r=>({id:r.id,kind:r.kind,day:r.day,note:r.note||null,off:!!r.off,updated_at:new Date().toISOString()}),
  bio:r=>({id:r.id,line:'biochar',job_type:r.job,production_date:r.date,hours:+r.hours,boxes:r.boxes?Math.round(+r.boxes):null,pallets:r.pallets?Math.round(+r.pallets):null,
    order_refs:r.orders||[],notes:r.notes||null,source:r.source==='form'||r.source==='import'?r.source:'dashboard',status:r.status||'active',void_reason:r.status==='void'?(r.voidReason||null):null,
    ...(Live.hasTotes?{pending_totes:(r.pendingTotes||[]).map(p=>{const it=itemOfKey(p.key);return {item_id:it.item_id,custom_name:it.custom_name||null,count:+p.count}})}:{})}),
  orc:r=>({id:r.id,production_date:r.date,product_bin_id:Live.binId(r.product),yards_in:+r.yardsIn,yards_out:+r.yardsOut,hours:+r.hours,destination:r.dest==='Bin'?'bin':'totes',
    bin_id:r.dest==='Bin'?Live.binId(r.bin):null,totes:r.dest==='Totes'?(+r.totes||0):null,notes:r.notes||null,source:r.source==='form'||r.source==='import'?r.source:'dashboard',
    status:r.status||'active',void_reason:r.status==='void'?(r.voidReason||null):null}),
  pick:r=>({id:r.id,production_date:r.date,material_bin_id:Live.binId(r.material),units:+r.units,hours:+r.hours||0,notes:r.notes||null,
    ...(Live.hasGrates&&r.pct?{grate_profile:r.grate||1,small_pct:r.pct.small,medium_pct:r.pct.medium,lost_pct:r.pct.lost}:{})}),
  bag:r=>({id:r.id,production_date:r.date,from_bin_id:Live.binId(r.material),yards_used:+r.yards,pallets:+r.pallets,hours:+r.hours||0,notes:r.notes||null}),
  orders:r=>({id:r.id,line:r.line,order_date:r.date,customer:r.customer,sales_order_no:r.so||null,notes:r.notes||null,completed:!!r.done,completed_on:r.done?(r.doneOn||iso(TODAY)):null,...(Live.hasPrio?{priority:r.done?null:(r.priority??null)}:{}),
    ...(Live.hasShip?{po:r.po||null,ready:!!r.ready}:{})}),
  purch:r=>{const raw=Object.entries(PURCH_RAW).find(([,n])=>n===r.material);
    return raw?{id:r.id,purchase_date:r.date,line:'biochar',item_id:itemOfKey(raw[0]).item_id,bin_id:null,amount:+r.amount,po:r.po||null,notes:r.notes||null}
              :{id:r.id,purchase_date:r.date,line:'orchid',item_id:null,bin_id:Live.binId(r.material),amount:+r.amount,po:r.po||null,notes:r.notes||null}},
  adj:r=>r.item.startsWith('O:')?{id:r.id,bin_id:Live.binId(r.item.slice(2)),item_id:null,qty_delta:+r.qty,reason:r.reason,adj_date:r.date,notes:r.notes||null}
        :{id:r.id,...itemOfKey(r.item),bin_id:null,qty_delta:+r.qty,reason:r.reason,adj_date:r.date,notes:r.notes||null},
};
const TABLE={bio:'production_runs',orc:'dryer_runs',pick:'picker_runs',bag:'bagging_runs',orders:'orders',purch:'purchases',adj:'inventory_adjustments',cal:'calendar_days'};
const must=async p=>{const {error}=await p;if(error)throw error};

/* ---- write what changed ---- */
Live.sync=async function(){
  if(!Live.base)return;
  if(Live.running){Live.again=true;return}
  Live.running=true;
  try{
    do{
      Live.again=false;
      /* give records made by the screens a real id */
      COLS.forEach(c=>(DB[c]||[]).forEach(r=>{if(!isUuid(r.id))r.id=newId()}));
      const B=Live.base,S0=Live.snap(); // what this pass saves; edits made while it runs differ from it and get the next pass
      for(const c of COLS){
        const cur=new Map((DB[c]||[]).map(r=>[r.id,r]));
        for(const [id,r] of cur){const was=B[c].get(id);if(was===JSON.stringify(r))continue;
          const kind=c==='oin'?r.type:c;
          if(c==='oin'&&was){const old=JSON.parse(was);if(old.type!==r.type)await must(sb.from(TABLE[old.type]).delete().eq('id',id))}
          await must(sb.from(TABLE[kind]).upsert(ROW[kind](r)));
          if(c==='bio'){
            await must(sb.from('run_workers').delete().eq('run_id',id));
            const ws=(r.crew||[]).map(n=>Live.empId(n)).filter(Boolean).map(e=>({run_id:id,employee_id:e}));
            if(ws.length)await must(sb.from('run_workers').insert(ws));
            await must(sb.from('run_lines').delete().eq('run_id',id));
            const ls=(r.lines||[]).filter(l=>+l.qty>0).map(l=>({run_id:id,direction:l.dir,qty:+l.qty,...itemOfKey(l.item,l.size),...(Live.hasTotes&&l.totes?{tote_count:+l.totes,tote_size_yd:+l.toteSize}:{})}));
            if(ls.length)await must(sb.from('run_lines').insert(ls));
          }
          if(c==='orders'){
            await must(sb.from('order_lines').delete().eq('order_id',id));
            const ls=(r.lines||[]).filter(l=>+l.qty>0).map(l=>({order_id:id,qty:+l.qty,load_type:l.load||null,...(l.key.startsWith('O:')?{bin_id:Live.binId(l.key.slice(2))}:itemOfKey(l.key))}));
            if(ls.length)await must(sb.from('order_lines').insert(ls));
          }
          if(c==='orc'){
            await must(sb.from('dryer_run_workers').delete().eq('run_id',id));
            const ws=(r.crew||[]).map(n=>Live.empId(n)).filter(Boolean).map(e=>({run_id:id,employee_id:e}));
            if(ws.length)await must(sb.from('dryer_run_workers').insert(ws));
          }
        }
        for(const [id,was] of B[c]){if(cur.has(id))continue;const old=JSON.parse(was);await must(sb.from(TABLE[c==='oin'?old.type:c]).delete().eq('id',id))}
      }
      /* counts: a changed count is a new count row; a removed count deletes that line's counts */
      const oldC=JSON.parse(B.counts),newC=DB.counts||{};
      const target=k=>k.startsWith('O:')?{bin_id:Live.binId(k.slice(2))}:itemOfKey(k);
      for(const [k,v] of Object.entries(newC)){if(JSON.stringify(oldC[k])===JSON.stringify(v))continue;
        await must(sb.from('inventory_counts').insert({...target(k),qty:+v.qty,counted_on:v.date}))}
      for(const k of Object.keys(oldC)){if(newC[k])continue;const t=target(k);let q=sb.from('inventory_counts').delete();
        q=t.bin_id?q.eq('bin_id',t.bin_id):q.eq('item_id',t.item_id);
        q=t.custom_name?q.eq('custom_name',t.custom_name):q.is('custom_name',null);
        q=t.custom_size_ft?q.eq('custom_size_ft',t.custom_size_ft):q.is('custom_size_ft',null);
        await must(q)}
      await Live.syncSettings();
      Live.base=S0;
      if(UI.line==='settings'&&[...document.querySelectorAll('#settingsSec [data-crew][data-f=name]')].some(el=>(SETTINGS.crew[+el.dataset.crew]||{}).id))renderSettings();
    }while(Live.again);
  }catch(e){
    console.error(e);toast('⚠ Couldn’t save: '+(e.message||e)+'. Reloading from the database.');
    try{await Live.load();render()}catch(_){}
  }finally{Live.running=false}
};
Live.syncSettings=async function(){
  const now=Live.ssnap();if(now===Live.sbase)return; // snapshot first: edits made during the awaits below stay unsaved for the next pass
  const old=JSON.parse(Live.sbase),cur=JSON.parse(now);
  const up=(key,value)=>must(sb.from('settings').upsert({key,value}));
  if(JSON.stringify(old.ratio)!==JSON.stringify(cur.ratio))await up('equipment_ratio',cur.ratio);
  if(JSON.stringify(old.bonus)!==JSON.stringify(cur.bonus))await up('bonus',{per_yard_in:cur.bonus[0],per_tote:cur.bonus[1],yards_per_tote:cur.bonus[2]});
  if(JSON.stringify(old.orc)!==JSON.stringify(cur.orc))await up('orchid',{yards_per_unit:cur.orc.y,ratios:cur.orc.r,profiles:cur.orc.p,active:cur.orc.a});
  if(JSON.stringify(old.dash)!==JSON.stringify(cur.dash))await up('dashboard',cur.dash);
  if(JSON.stringify(old.totes)!==JSON.stringify(cur.totes))await up('tote_sizes',cur.totes);
  /* crew */
  for(const c of SETTINGS.crew){if(!c.name)continue;
    const row={name:c.name,on_biochar_sheet:!!c.biochar,on_dryer_sheet:!!c.orchid,active:true};
    if(c.id)await must(sb.from('employees').update(row).eq('id',c.id));
    else{const {data,error}=await sb.from('employees').upsert(row,{onConflict:'name'}).select('id').single();if(error)throw error;c.id=data.id}}
  const keep=new Set(SETTINGS.crew.map(c=>c.id).filter(Boolean));
  for(const c of (old.crew||[]))if(c.id&&!keep.has(c.id))await must(sb.from('employees').update({active:false,on_biochar_sheet:false,on_dryer_sheet:false}).eq('id',c.id));
  Live.emp=await fetchAll('employees','*',q=>q.order('name'));
  /* blends, sock sizes */
  const maxSort=Math.max(0,...Live.items.map(i=>i.sort||0));
  for(const b of cur.blends.filter(b=>!old.blends.includes(b))){
    await must(sb.from('items').upsert({line:'biochar',code:'14-14-CC1',kind:'blend',name:'Washed · '+b,blend:b,unit:'yd',sort:maxSort+1,active:true},{onConflict:'code,name'}))}
  for(const b of old.blends.filter(b=>!cur.blends.includes(b)))
    await must(sb.from('items').update({active:false}).eq('kind','blend').eq('blend',b).eq('is_custom',false));
  for(const b of (cur.bags||[]).filter(b=>!(old.bags||[]).includes(b)))
    await must(sb.from('items').upsert({line:'biochar',code:'07-86-15W',kind:'bag',name:'1.5cf bag · '+b,blend:b,unit:'ea',sort:maxSort+2,active:true},{onConflict:'code,name'}));
  for(const b of (old.bags||[]).filter(b=>!(cur.bags||[]).includes(b)))
    await must(sb.from('items').update({active:false}).eq('kind','bag').eq('blend',b).eq('is_custom',false));
  for(const z of cur.socks.filter(z=>!old.socks.includes(z)))
    await must(sb.from('items').upsert({line:'biochar',code:'14-14-SO1',kind:'sock',name:`Sock · ${z} ft`,size_ft:z,unit:'ea',sort:maxSort+3,active:true},{onConflict:'code,name'}));
  for(const z of old.socks.filter(z=>!cur.socks.includes(z)))
    await must(sb.from('items').update({active:false}).eq('kind','sock').eq('name',`Sock · ${z} ft`));
  if(JSON.stringify(old.blends)!==JSON.stringify(cur.blends)||JSON.stringify(old.bags)!==JSON.stringify(cur.bags)||JSON.stringify(old.socks)!==JSON.stringify(cur.socks))Live.items=await fetchAll('items');
  /* bins the manager added */
  const oldB=new Set(old.bins.map(b=>b.name)),curB=new Set(cur.bins.map(b=>b.name));
  for(const b of cur.bins.filter(b=>!oldB.has(b.name)))
    await must(sb.from('bins').upsert({name:b.name,kind:b.kind,unit:b.kind==='bagged'?'pallets':b.kind==='totes'?'totes':'yd',note:b.note||null,on_map:true,dryer_input:b.kind==='green',purchasable:b.kind==='green',
      totes_to:b.kind==='green'?'Medium totes':null,bags_to:b.kind==='dried'?'Medium bagged':null,is_core:false,active:true,sort:{green:170,dried:230,bagged:315,totes:335}[b.kind]},{onConflict:'name'}));
  for(const b of old.bins.filter(b=>!curB.has(b.name)))await must(sb.from('bins').update({active:false}).eq('name',b.name).eq('is_core',false));
  if(cur.bins.length!==old.bins.length||[...curB].some(n=>!oldB.has(n)))Live.bins=await fetchAll('bins','*',q=>q.order('sort'));
  /* bin notes */
  for(const [name,note] of Object.entries(cur.binNotes||{}))if((old.binNotes||{})[name]!==note)
    await must(sb.from('bins').update({note:note||null}).eq('name',name));
  /* saved reports */
  const oR=new Map(old.reports.map(r=>[r.id,JSON.stringify(r)])),cR=new Map(cur.reports.map(r=>[r.id,r]));
  for(const [id,r] of cR){if(oR.get(id)===JSON.stringify(r))continue;if(!isUuid(id)){const nid=newId();(SETTINGS.reports.find(x=>x.id===id)||{}).id=nid;r.id=nid;
      if(UI.rb)Object.values(UI.rb).forEach(c=>{if(c&&c.id===id)c.id=nid})}
    await must(sb.from('saved_reports').upsert({id:r.id,line:r.line,name:r.name,config:r.cfg}))}
  for(const id of oR.keys())if(!cR.has(id)&&isUuid(id))await must(sb.from('saved_reports').delete().eq('id',id));
  Live.sbase=now;
};
let syncTimer=null;
Live.queue=()=>{clearTimeout(syncTimer);syncTimer=setTimeout(()=>Live.sync(),0)};

/* ---- sign-in ---- */
Live.showLogin=msg=>{$('#login').hidden=false;$('#appShell').hidden=true;$('#loginErr').textContent=msg||'';$('#lgEmail').focus()};
Live.boot=async function(){
  if(!sb){document.body.innerHTML='<p style="padding:30px">The dashboard can’t reach the database (config.js didn’t load).</p>';return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return Live.showLogin();
  ME=session.user.email||'manager';$('#whoEmail').textContent=ME;
  $('#login').hidden=true;$('#appShell').hidden=false;$('#loading').hidden=false;
  try{await Live.load();await Live.seedReports()}
  catch(e){console.error(e);$('#loading').textContent='Couldn’t load the data: '+(e.message||e);return}
  $('#loading').hidden=true;
  /* version history starts fresh for each sign-in on this browser */
  VH.list=[];VH.ptr=-1;VH_CUR=vhState();try{localStorage.removeItem('d14.versions')}catch(e){};vhButtons();
  render();
};
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();const btn=$('#lgBtn');btn.disabled=true;btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:$('#lgPass').value});
  btn.disabled=false;btn.textContent='Sign in';
  if(error)return Live.showLogin(error.message==='Invalid login credentials'?'That email and password don’t match a login.':error.message);
  $('#lgPass').value='';Live.boot();
};
$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};
/* pick up other people's changes when you come back to the tab */
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!Live.base||Live.running||$('#modalRoot').innerHTML||Date.now()-Live.loadedAt<60000)return;
  try{await Live.load();VH.list=[];VH.ptr=-1;VH_CUR=vhState();vhPersist();vhButtons();render()}catch(e){}
});

LIVE_Q=Live.queue;
Live.boot();
