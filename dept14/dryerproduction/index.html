<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dryer Production Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Shared look with /charproduction. Layout: one column, phone first. Header → who/when → job type → job questions → shipping/notes → submit. Big tap targets, no typing for numbers that can be stepped. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunken:#EAECE7; --ink:#1B211D; --muted:#5F6A63; --line:#DADFD8; --line-strong:#C3CAC1;
  --accent:#2F6B47; --accent-ink:#FFFFFF; --accent-soft:#E2EEE6; --bar:#1B211D; --bar-ink:#F3F4F1; --bad:#B23A30; --bad-soft:#F8E4E1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1A201C; --sunken:#222924; --ink:#E6EBE7; --muted:#9AA69F; --line:#2D3530; --line-strong:#3B4540;
  --accent:#74BF8E; --accent-ink:#0E1511; --accent-soft:#1F3227; --bar:#0B0E0C; --bar-ink:#E6EBE7; --bad:#EE7B6F; --bad-soft:#3A1F1C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A201C; --sunken:#222924; --ink:#E6EBE7; --muted:#9AA69F; --line:#2D3530; --line-strong:#3B4540;
  --accent:#74BF8E; --accent-ink:#0E1511; --accent-soft:#1F3227; --bar:#0B0E0C; --bar-ink:#E6EBE7; --bad:#EE7B6F; --bad-soft:#3A1F1C; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{background:var(--bar);color:var(--bar-ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
.top-in{max-width:528px;margin:0 auto;display:grid;gap:2px} /* = main width minus its 16px side padding, so the title lines up with the cards */
.dept{font:500 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;opacity:.7}
.top h1{font:700 1.9rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.demo{justify-self:start;margin-top:6px;font:500 .68rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;padding:4px 8px;border-radius:99px;border:1px solid #E3A94B;color:#E3A94B}

main{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.intro{margin:0;color:var(--muted);font-size:.95rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.q.bad{border-color:var(--bad);background:linear-gradient(var(--bad-soft),var(--bad-soft)) padding-box}
.q>label,.q>.lbl{font:600 1.05rem/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.q .hint{font-size:.85rem;color:var(--muted);margin-top:-6px}
.q .err{color:var(--bad);font-size:.9rem;font-weight:500}
.sect{font:700 1.25rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;margin:8px 2px 0;color:var(--muted)}

input[type=date],input[type=text],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:8px;padding:12px;min-height:50px}
textarea{min-height:80px;resize:vertical}

/* Chips (multi/single select) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:10px 16px;min-height:46px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jobs .chip{border-radius:8px;min-height:64px;font:700 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em}

/* Stepper rows */
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row .name{font-weight:600}
.row .name small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.step{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface);flex-shrink:0}
.step button{width:48px;height:50px;border:0;background:var(--sunken);font-size:1.5rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.step button:active{background:var(--line)}
.step input{width:74px;height:50px;border:0;text-align:center;background:transparent;font:500 1.1rem var(--f-mono);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font:500 .8rem var(--f-mono);color:var(--muted);flex:0 0 20px;width:20px}
.row .name{min-width:0;text-wrap:balance}
@media (max-width:400px){.step button{width:44px}.step input{width:56px}}
.custom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px dashed var(--line-strong);border-radius:8px}
.custom .pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;cursor:pointer;justify-self:start}
.charrow{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.charhead{display:flex;gap:8px;align-items:center}
.charrow>input[type=text],.charhead input[type=text]{flex:1}
select{width:100%;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:8px;padding:12px;min-height:50px;font-weight:600}
.rm{background:none;border:0;color:var(--muted);font-size:1.3rem;width:40px;height:40px;cursor:pointer}

.submit{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);min-height:60px;font:700 1.4rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;width:100%}
.submit:disabled{opacity:.6}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.formerr{color:var(--bad);font-weight:600;text-align:center}

/* Done screen */
.done{text-align:center;display:grid;gap:12px;padding:24px 8px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:2.4rem;margin:0 auto}
.done h2{font:700 2rem/1 var(--f-display);text-transform:uppercase;margin:0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px;font-size:.95rem}
.summary div{display:flex;justify-content:space-between;gap:12px}
.summary span:first-child{color:var(--muted)}
.ghostbtn{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--r);min-height:54px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="dept">Rexius · Dept 14</div>
    <h1 id="title">Dryer production sheet</h1>
  </div>
</header>
<main id="app"><div class="loading">Loading…</div></main>

<script>
/* =============================================================
   Dryer production sheet — open crew form (/dryerproduction)
   Replaces the Google Form "Production Sheets" (bark dryer).
   Live: the pick-lists come from dept14.form_options('orchid') and a
   submit goes to dept14.submit_dryer_run. Both run as the public (anon)
   key; anon can't read or change anything else.
   ============================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('d14.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('d14.'+k,JSON.stringify(v))}catch(e){}}};

/* Sheet setup: crew on the dryer sheet, products into the dryer and dried bins, from Supabase. */
const SHEET={title:'Dryer production sheet',crew:[],products:[],bins:[]};
const IDS={crew:{},product:{},bin:{}};
const CFG=window.MIX_BOARD_CONFIG||{};
const sb=window.supabase&&CFG.SUPABASE_URL?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{db:{schema:'dept14'},auth:{persistSession:false}}):null;
async function loadSheet(){
  if(!sb)throw new Error('The sheet can’t reach the database.');
  const {data,error}=await sb.rpc('form_options',{p_line:'orchid'});
  if(error)throw error;
  const put=(list,key)=>(list||[]).map(x=>{IDS[key][x.name]=x.id;return x.name});
  SHEET.crew=put(data.employees,'crew');SHEET.products=put(data.products,'product');SHEET.bins=put(data.bins,'bin');
}
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fresh=()=>({date:today(),crew:store.get('dryer.lastCrew',[]).filter(c=>SHEET.crew.includes(c)),product:'',yin:'',yout:'',hours:'',dest:'',bin:'',totes:'',notes:''});
let F=fresh(),errors={};

const stepper=(key,val,step=1,unit='',label='')=>`<div class="step"><button type="button" data-dec="${esc(key)}" data-step="${step}" aria-label="Less ${esc(label)}">−</button><input type="number" inputmode="decimal" min="0" step="${step}" data-k="${esc(key)}" value="${esc(val)}" aria-label="${esc(label)}" placeholder="0"><button type="button" data-inc="${esc(key)}" data-step="${step}" aria-label="More ${esc(label)}">+</button></div><span class="unit">${esc(unit)}</span>`;
const chips=(group,opts,selected,multi)=>`<div class="chips" role="group">${opts.map(o=>`<button type="button" class="chip" data-chip="${group}" data-v="${esc(o)}" aria-pressed="${multi?selected.includes(o):selected===o}">${esc(o)}</button>`).join('')}</div>`;
const q=(id,label,body,hint='')=>`<div class="q ${errors[id]?'bad':''}" id="q-${id}"><div class="lbl">${label}</div>${hint?`<div class="hint">${hint}</div>`:''}${body}${errors[id]?`<div class="err">${esc(errors[id])}</div>`:''}</div>`;
const row=(name,inner)=>`<div class="row"><span class="name">${esc(name)}</span><div style="display:flex;align-items:center;gap:8px">${inner}</div></div>`;

function render(){
  let h=`
  ${q('date','Production date',`<input type="date" data-k="date" value="${esc(F.date)}" max="${today()}">`)}
  ${q('crew','Who worked on it?',chips('crew',SHEET.crew,F.crew,true))}
  ${q('product','What went into the dryer?',`<select data-k="product" aria-label="Product into the dryer"><option value="">Pick a product</option>${SHEET.products.map(p=>`<option value="${esc(p)}" ${F.product===p?'selected':''}>${esc(p)}</option>`).join('')}</select>`)}
  ${q('yards','Yards',`<div class="rows">${row('Went in',stepper('yin',F.yin,.5,'yd','yards in'))}${row('Came out',stepper('yout',F.yout,.5,'yd','yards out'))}</div>`)}
  ${q('hours','How many hours did it take?',row('Hours',stepper('hours',F.hours,.5,'h','hours')))}
  ${q('dest','Where did it go?',`<div class="jobs" style="grid-template-columns:1fr 1fr">${['Totes','Bin'].map(x=>`<button type="button" class="chip" data-chip="dest" data-v="${x}" aria-pressed="${F.dest===x}">${x}</button>`).join('')}</div>`)}`;
  if(F.dest==='Totes')h+=q('totes','How many totes?',`<input type="text" inputmode="decimal" data-k="totes" value="${esc(F.totes)}" autocomplete="off" aria-label="Number of totes">`);
  if(F.dest==='Bin')h+=q('bin','Which bin?',chips('bin',SHEET.bins,F.bin,false));
  h+=q('notes','Notes',`<textarea data-k="notes">${esc(F.notes)}</textarea>`);
  h+=`<div class="formerr" id="formerr">${Object.keys(errors).length?'Fix the highlighted questions above.':''}</div>
    <button type="button" class="submit" id="submit" ${sending?'disabled':''}>${sending?'Sending…':'Submit'}</button>`;
  $('#app').innerHTML=h;
}

const errFor={date:'date',crew:'crew',product:'product',yin:'yards',yout:'yards',hours:'hours',dest:'dest',totes:'totes',bin:'bin'};
function clearErr(k){const e=errFor[k];if(e&&errors[e]){delete errors[e];const el=$('#q-'+e);if(el){el.classList.remove('bad');el.querySelector('.err')?.remove()}if(!Object.keys(errors).length&&$('#formerr'))$('#formerr').textContent=''}}
$('#app').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k||sending)return;F[k]=e.target.type==='number'?(e.target.value===''?'':+e.target.value):e.target.value;clearErr(k)});
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled||sending)return;
  if(b.dataset.inc||b.dataset.dec){const k=b.dataset.inc||b.dataset.dec,st=+b.dataset.step;const nv=Math.max(0,Math.round(((+F[k]||0)+(b.dataset.inc?st:-st))*100)/100);
    F[k]=nv||'';b.parentElement.querySelector('input').value=nv||'';clearErr(k);return}
  if(b.dataset.chip){const g=b.dataset.chip,v=b.dataset.v;
    if(g==='crew'){const i=F.crew.indexOf(v);i<0?F.crew.push(v):F.crew.splice(i,1);b.setAttribute('aria-pressed',i<0);clearErr('crew');return}
    F[g]=v;clearErr(g);render();return}
  if(b.id==='submit'){submit();return}
  if(b.id==='again'){F=fresh();BASE=snap();errors={};render();scrollTo(0,0)}
});

function validate(){
  const e={},n=v=>+v||0;
  if(!F.date)e.date='Pick the production date.';else if(F.date>today())e.date='The date can’t be in the future.';
  if(!F.crew.length)e.crew='Pick at least one name.';
  if(!F.product)e.product='Pick what went into the dryer.';
  if(!(n(F.yin)>0))e.yards='Enter the yards that went in.';
  else if(!(n(F.yout)>0))e.yards='Enter the yards that came out.';
  else if(n(F.yout)>n(F.yin))e.yards='Yards out can’t be more than yards in.';
  if(!(n(F.hours)>0))e.hours='Enter how many hours it took.';else if(n(F.hours)>24)e.hours='Hours can’t be more than 24.';
  if(!F.dest)e.dest='Pick Totes or Bin.';
  if(F.dest==='Totes'){const t=String(F.totes).trim();if(!t)e.totes='Enter how many totes.';else if(!/^\d*\.?\d+$/.test(t)||!(+t>0))e.totes='Enter a number, like 9 or 9.75.'}
  if(F.dest==='Bin'&&!F.bin)e.bin='Pick the bin.';
  return e;
}
let sending=false;
async function submit(){
  if(sending)return;
  errors=validate();
  if(Object.keys(errors).length){render();$('.q.bad')?.scrollIntoView({behavior:'smooth',block:'center'});return}
  const n=v=>+v||0;
  const payload={production_date:F.date,worker_ids:F.crew.map(c=>IDS.crew[c]),product_id:IDS.product[F.product],
    yards_in:n(F.yin),yards_out:n(F.yout),hours:n(F.hours),destination:F.dest.toLowerCase(),
    bin_id:F.dest==='Bin'?IDS.bin[F.bin]:null,totes:F.dest==='Totes'?n(F.totes):null,notes:F.notes.trim()};
  const btn=$('#submit');sending=true;btn.disabled=true;btn.textContent='Sending…';$('#formerr').textContent='';
  try{
    const {error}=await sb.rpc('submit_dryer_run',{payload});
    if(error)throw error;
  }catch(e){
    sending=false;btn.disabled=false;btn.textContent='Submit';
    $('#formerr').textContent=(e&&e.message&&!/fetch|network/i.test(e.message))?e.message+'.':'Couldn’t send. Check your signal and press Submit again. Nothing was lost.';
    return;
  }
  sending=false;
  store.set('dryer.lastCrew',F.crew);
  $('#app').innerHTML=`<div class="done"><div class="tick" aria-hidden="true">✓</div><h2>Sent</h2><button type="button" class="ghostbtn" id="again">Submit another run</button></div>`;
  scrollTo(0,0);
}
/* fresh options: when the page comes back into view or every 5 min, reload crew/products/bins, but only while the form is untouched */
const snap=()=>JSON.stringify(F);
let BASE='',LOADING=false,LOADED=false;
async function refreshOptions(){
  if(LOADING||sending||document.hidden||$('.done'))return;
  if(LOADED&&snap()!==BASE)return;
  LOADING=true;
  try{await loadSheet()}catch(e){LOADING=false;return}
  LOADING=false;
  const a=document.activeElement;
  if(sending||$('.done')||(LOADED&&snap()!==BASE)||(LOADED&&a&&a!==document.body&&$('#app').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))return;
  F=fresh();BASE=snap();errors={};LOADED=true;render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOptions()});
setInterval(refreshOptions,5*60*1000);
loadSheet().then(()=>{F=fresh();BASE=snap();LOADED=true;render()}).catch(()=>{
  $('#app').innerHTML=`<div class="loading">Couldn’t load the sheet. Check your signal and reload the page.</div>`});
</script>
</body>
</html>
